<div class="pencil-code-editor-container">
  <div [hidden]="pencilCodeEditorIsLoaded" class="pencil-code-editor-iframe oppia-pencil-code-editor-iframe">
    <div></div>
  </div>
  <div *ngIf="pencilCodeEditorIsLoaded" class="oppia-error-message-container">
    Failed to load the editor. Please try refreshing.
  </div>
  <div *ngIf="!pencilCodeEditorIsLoaded" class="oppia-reset-code-button-container">
    <button mat-button class="oppia-reset-code-text"
            (click)="reset()"
            [disabled]="!interactionIsActive"
            [innerHTML]="'I18N_RESET_CODE' | translate">
    </button>
  </div>
</div>
