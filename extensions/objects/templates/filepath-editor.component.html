<svg-editor *ngIf="svgEditorIsShown"
            (validityChange)="validityHasChanged($event)"
            (valueChanged)="valueHasChanged($event)"
            (discardImage)="resetEditor()"
            [value]="value">
</svg-editor>
<image-editor *ngIf="imageEditorIsShown"
              (validityChange)="validityHasChanged($event)"
              (valueChanged)="valueHasChanged($event)"
              [value]="value"
              [modalId]="modalId">
</image-editor>
<div *ngIf="!svgEditorIsShown && !imageEditorIsShown" class="create-or-upload-image-selector-container">
  <div class="upload-image-container">
    <div class="mb-4 fw-bold">Browse from Your Device</div>
    <button class="btn btn-primary e2e-test-upload-image" (click)="onClickUploadImage()">
      UPLOAD <i class="fa fa-upload" aria-hidden="true"></i>
    </button>
  </div>
  <div class="create-image-container">
    <div class="mb-4 fw-bold">Make from Scratch</div>
    <button class="btn create-image-button e2e-test-create-image" (click)="onClickCreateImage()">CREATE</button>
  </div>
</div>
