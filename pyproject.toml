# Black configuration removed - now using Ruff for formatting.
# See [tool.ruff.format] below.

[tool.ruff]
line-length = 80
target-version = "py311"
extend-exclude = [
    "scripts/linters/test_files/invalid_*.py",
    "scripts/linters/test_files/*invalid*.py",
    "stubs",
]

[tool.ruff.format]
# Match Black's behavior exactly.
quote-style = "preserve"            # Match Black's skip-string-normalization = true
indent-style = "space"              # Black's default
skip-magic-trailing-comma = false   # Respect trailing commas like Black
line-ending = "auto"                # Auto-detect like Black
docstring-code-format = false       # Don't reformat docstring code (Black doesn't)

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-third-party = [
    "apache_beam",
    "backports.functools_lru_cache",
    "browsermobproxy",
    "cloudstorage",
    "contextlib2",
    "elasticsearch",
    "firebase_admin",
    "google.api_core",
    "google.appengine",
    "google.cloud",
    "google.protobuf",
    "mapreduce",
    "mock",
    "mutagen",
    "pipeline",
    "psutil",
    "pylatexenc",
    "pylint",
    "requests",
    "requests_mock",
    "selenium",
    "six",
    "skulpt",
    "typing",
    "webapp2",
    "webapp2_extras",
    "webtest",
    "yaml",
]
[tool.ruff.lint.per-file-ignores]
"core/tests/data/image_constants.py" = ["E501"]