[tool.black]
line-length = 80
skip-string-normalization = true

[tool.ruff]
line-length = 80
extend-exclude = [
    "scripts/linters/test_files/invalid_*.py",
    "scripts/linters/test_files/*invalid*.py",
]

[tool.ruff.format]
quote-style = "preserve"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-third-party = [
    "apache_beam",
    "backports.functools_lru_cache",
    "browsermobproxy",
    "cloudstorage",
    "contextlib2",
    "elasticsearch",
    "firebase_admin",
    "google.api_core",
    "google.appengine",
    "google.cloud",
    "google.protobuf",
    "mapreduce",
    "mock",
    "mutagen",
    "pipeline",
    "psutil",
    "pylatexenc",
    "pylint",
    "requests",
    "requests_mock",
    "selenium",
    "six",
    "skulpt",
    "typing",
    "webapp2",
    "webapp2_extras",
    "webtest",
    "yaml",
]
