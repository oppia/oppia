<div>
  <div class="oppia-search-bar-container">
    <oppia-search-bar [enableDropup]="false"></oppia-search-bar>
  </div>
  <div *ngIf="!someResultsExist" class="oppia-search-results-intro">
    <div class="oppia-search-results-no-match">
      <picture>
        <source type="image/webp"
                [srcset]="getStaticCopyrightedImageUrl('/general/no_explorations_found.webp')">
        <source type="image/png"
                [srcset]="getStaticCopyrightedImageUrl('/general/no_explorations_found.png')">
        <img *ngIf="!profilePictureDataUrl"
             [src]="getStaticCopyrightedImageUrl('/general/no_explorations_found.png')">
      </picture>
      <p class="text-center">
        <span>{{ 'I18N_LIBRARY_NO_EXPLORATION_FOR_QUERY' | translate }}</span><br><br>
        <a *ngIf="!userIsLoggedIn" href="" (click)="onRedirectToLogin('/creator-dashboard?mode=create')">
          {{ 'I18N_LIBRARY_CREATE_EXPLORATION_QUESTION' | translate }}
        </a>
        <a *ngIf="userIsLoggedIn" href="/creator-dashboard?mode=create">
          {{ 'I18N_LIBRARY_CREATE_EXPLORATION_QUESTION' | translate }}
        </a>
      </p>
    </div>
  </div>

  <oppia-activity-tiles-infinity-grid></oppia-activity-tiles-infinity-grid>
</div>
