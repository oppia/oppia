<div class="position-relative oppia-learner-dash-container w-100">
  <div [ngStyle]="windowIsNarrow ? {'display': 'block'} : {'display': 'flex'}"
       [ngClass]="{'oppia-learner-dashboard-mobile-mode': windowIsNarrow, 'oppia-learner-dash-content': true}">
    <nav class="align-items-center d-flex flex-md-column justify-content-center oppia-learner-dash-sidebar_position" role="navigation">
      <ol class="oppia-learner-dash-sidebar e2e-test-learner-dashboard-sidebar">
        <li class="oppia-learner-dash-sidebar_pic e2e-test-learner-dash-sidebar-pic">
          <!--if want frame, div w/ "border border-2 border-white mb-5 rounded-circle oppia-learner-dash-sidebar_pic-frame" style-->
          <picture>
            <source type="image/webp" [srcset]="profilePictureWebpDataUrl" >
            <source type="image/png" [srcset]="profilePicturePngDataUrl" >
            <img alt="Profile image of user" class="mb-5" height="72px" [src]="profilePicturePngDataUrl" width="72px" >
          </picture>
        </li>
        <li>
          <button aria-label="Go to home tab"
                  class="align-items-center d-inline-flex e2e-test-home-section rounded oppia-learner-dash-sidebar_btn text-left w-100"
                  tabindex="0"
                  [ngClass]="{'oppia-learner-dash-sidebar_btn--active': activeSection === LEARNER_DASHBOARD_SECTION_I18N_IDS.HOME}"
                  (click)="setActiveSection(LEARNER_DASHBOARD_SECTION_I18N_IDS.HOME)"
                  (keyup.enter)="setActiveSection(LEARNER_DASHBOARD_SECTION_I18N_IDS.HOME)">
            <span aria-hidden="true" class="fas fa-home fa-lg"></span>
            {{ LEARNER_DASHBOARD_SECTION_I18N_IDS.HOME | translate }}
          </button>
        </li>
        <li>
          <button aria-label="Go to goals tab"
                  class="align-items-center d-inline-flex e2e-test-goals-section rounded oppia-learner-dash-sidebar_btn text-left w-100"
                  tabindex="0"
                  [ngClass]="{'oppia-learner-dash-sidebar_btn--active': activeSection === LEARNER_DASHBOARD_SECTION_I18N_IDS.GOALS}"
                  (click)="setActiveSection(LEARNER_DASHBOARD_SECTION_I18N_IDS.GOALS)"
                  (keyup.enter)="setActiveSection(LEARNER_DASHBOARD_SECTION_I18N_IDS.GOALS)">
            <span aria-hidden="true" class="fas fa-bullseye fa-lg"></span>
            {{ LEARNER_DASHBOARD_SECTION_I18N_IDS.GOALS | translate }}
          </button>
        </li>
        <li>
          <button aria-label="Go to progress tab"
                  class="align-items-center d-inline-flex rounded oppia-learner-dash-sidebar_btn text-start w-100  e2e-test-progress-section"
                  tabindex="0"
                  [ngClass]="{'oppia-learner-dash-sidebar_btn--active': activeSection === LEARNER_DASHBOARD_SECTION_I18N_IDS.PROGRESS}"
                  (click)="setActiveSection(LEARNER_DASHBOARD_SECTION_I18N_IDS.PROGRESS)"
                  (keyup.enter)="setActiveSection(LEARNER_DASHBOARD_SECTION_I18N_IDS.PROGRESS)">
            <span aria-hidden="true" class="fas fa-chart-line fa-lg"></span>
            {{ LEARNER_DASHBOARD_SECTION_I18N_IDS.PROGRESS | translate }}
          </button>
        </li>
        <li *ngIf="isCertificateAssessmentEnabled()">
          <button aria-label="Go to my certificates tab"
                  class="align-items-center d-inline-flex rounded oppia-learner-dash-sidebar_btn text-left w-100 e2e-test-my-certificates-section"
                  tabindex="0"
                  [ngClass]="{'oppia-learner-dash-sidebar_btn--active': activeSection === LEARNER_DASHBOARD_SECTION_I18N_IDS.MY_CERTIFICATES}"
                  (click)="setActiveSection(LEARNER_DASHBOARD_SECTION_I18N_IDS.MY_CERTIFICATES)"
                  (keyup.enter)="setActiveSection(LEARNER_DASHBOARD_SECTION_I18N_IDS.MY_CERTIFICATES)">
            <span aria-hidden="true" class="fas fa-certificate fa-lg"></span>
            {{ LEARNER_DASHBOARD_SECTION_I18N_IDS.MY_CERTIFICATES | translate }}
          </button>
        </li>
        <li *ngIf="isNewExplorationEditorFeedbackTabEnabled()">
          <button aria-label="Go to my suggestions tab"
                  class="align-items-center d-inline-flex rounded oppia-learner-dash-sidebar_btn text-left w-100 e2e-test-my-suggestions-section"
                  tabindex="0"
                  type="button"
                  [ngClass]="{'oppia-learner-dash-sidebar_btn--active': activeSection === LEARNER_DASHBOARD_SECTION_I18N_IDS.MY_SUGGESTIONS}"
                  (click)="setActiveSection(LEARNER_DASHBOARD_SECTION_I18N_IDS.MY_SUGGESTIONS)"
                  (keyup.enter)="setActiveSection(LEARNER_DASHBOARD_SECTION_I18N_IDS.MY_SUGGESTIONS)">
            <span aria-hidden="true" class="fas fa-comment-dots fa-lg"></span>
            {{ LEARNER_DASHBOARD_SECTION_I18N_IDS.MY_SUGGESTIONS | translate }}
            <span *ngIf="unreadMySuggestionsCount > 0"
                  class="oppia-learner-dashboard-sidebar-notification-badge">
              {{ unreadMySuggestionsCount }}
            </span>
          </button>
        </li>
      </ol>
    </nav>
    <div class="oppia-learner-dashboard-mobile-mode oppia-learner-dash-tab overflow-hidden px-4 px-md-0">
      <div class="d-flex flex-column w-100" [ngClass]="{'justify-content-center': windowIsNarrow}">
        <p class="oppia-learner-dash-greeting mt-4 e2e-test-learner-greetings"> {{ getDashboardTabHeading() | translate: {username: username} }} </p>
        <div class="w-100" *ngIf="activeSection === LEARNER_DASHBOARD_SECTION_I18N_IDS.HOME && communityLessonsDataLoaded">
          <oppia-home-tab [currentGoals]="topicsToLearn"
                          [goalTopics]="allTopics"
                          [incompleteCollectionsList]="incompleteCollectionsList"
                          [incompleteExplorationsList]="incompleteExplorationsList"
                          [partiallyLearntTopicsList]="partiallyLearntTopicsList"
                          [untrackedTopics]="untrackedTopics"
                          [username]="username"
                          (setActiveSection)="setActiveSection($event)">
          </oppia-home-tab>
        </div>
        <div *ngIf="activeSection === LEARNER_DASHBOARD_SECTION_I18N_IDS.GOALS">
          <oppia-goals-tab [currentGoals]="topicsToLearn"
                           [editGoals]="allTopics"
                           [completedGoals]="learntTopicsList"
                           [untrackedTopics]="untrackedTopics"
                           [partiallyLearntTopicsList]="partiallyLearntTopicsList"
                           [learntToPartiallyLearntTopics]="learntToPartiallyLearntTopics">
          </oppia-goals-tab>
        </div>
        <div *ngIf="activeSection === LEARNER_DASHBOARD_SECTION_I18N_IDS.LEARNER_GROUPS && LEARNER_GROUP_FEATURE_IS_ENABLED">
          <oppia-learner-groups-tab [username]="username"
                                    (setActiveSection)="setActiveSection($event)">
          </oppia-learner-groups-tab>
        </div>
        <div class="w-100" *ngIf="(activeSection === LEARNER_DASHBOARD_SECTION_I18N_IDS.PROGRESS || activeSection === LEARNER_DASHBOARD_SECTION_I18N_IDS.COMMUNITY_LESSONS) && communityLessonsDataLoaded">
          <oppia-progress-tab [incompleteExplorationsList]="incompleteExplorationsList"
                                       [incompleteCollectionsList]="incompleteCollectionsList"
                                       [completedExplorationsList]="completedExplorationsList"
                                       [completedCollectionsList]="completedCollectionsList"
                                       [subscriptionsList]="subscriptionsList"
                                       [partiallyLearntTopicsList]="partiallyLearntTopicsList"
                                       [learntTopicsList]="learntTopicsList"
                                       [completedToIncompleteCollections]="completedToIncompleteCollections"
                                       [currentGoals]="topicsToLearn"
                                       [subtopicMasteries]="subtopicMasteries">
          </oppia-progress-tab>
        </div>
        <div class="w-100" *ngIf="isCertificateAssessmentEnabled() && activeSection === LEARNER_DASHBOARD_SECTION_I18N_IDS.MY_CERTIFICATES">
          <oppia-my-certificates-tab>
          </oppia-my-certificates-tab>
        </div>
        <div class="w-100" *ngIf="isNewExplorationEditorFeedbackTabEnabled() && activeSection === LEARNER_DASHBOARD_SECTION_I18N_IDS.MY_SUGGESTIONS">
          <oppia-my-suggestions-tab
                                    (unreadCountChanged)="onMySuggestionsUnreadCountChanged($event)">
          </oppia-my-suggestions-tab>
        </div>
      </div>
    </div>
  </div>
</div>
