<div class="e2e-test-goals-section e2e-test-goals-section-container">
  <div>
    <div [ngStyle]="{'gap': '0px 4px'}" class="oppia-learner-dash-section d-flex justify-content-between">
      <p class="oppia-learner-dash-goals-text mb-0"> {{ 'I18N_LEARNER_DASHBOARD_GOALS_SECTION_INSTRUCTIONS' | translate }} </p>
      <!--TODO(#18384): Check to see if text is part of button (text changes when hover too)-->
      <button aria-label="Add goals (open modal)" class="oppia-learner-dash-button--add-goals d-flex align-items-center justify-content-center flex-grow-1 bg-white border-0 e2e-test-add-goals-button" (click)="openModal()">
        <span class="oppia-learner-dash-goals-add-circle">
          <span aria-hidden="true" class="fas fa-plus"></span>
        </span>
        <span class="oppia-learner-dash-goals-add-text">{{ 'I18N_LEARNER_DASHBOARD_GOALS_SECTION_ADD_BUTTON' | translate }} </span>
      </button>
    </div>
    <ng-container *ngIf="currentGoals.length !== 0">
      <div class="e2e-test-current-goals-section">
        <p class="oppia-learner-dash-goals-heading e2e-test-goals-heading"> {{ 'I18N_LEARNER_DASHBOARD_INCOMPLETE_SECTION' | translate }} </p>
        <hr color="#00645c" class="mt-2 mb-4" size="2" width="100%">
        <ng-container *ngFor="let goal of currentGoals">
          <oppia-goal-list [goalTopic]="goal">
            <button aria-label="Remove in-progress goal" (click)="removeGoal(goal.id, goal.name)" class="oppia-learner-dash-button-sm oppia-learner-dash-button-delete-goals border-0">
              <span aria-hidden="true" class="fas fa-trash"></span>
            </button>
          </oppia-goal-list>
        </ng-container>
      </div>
    </ng-container>
    <ng-container *ngIf="completedGoals.length !== 0">
      <div class="e2e-test-completed-goals-section">
        <p class="oppia-learner-dash-goals-heading e2e-test-goals-heading"> {{ 'I18N_LEARNER_DASHBOARD_COMPLETED_SECTION' | translate }} </p>
        <hr color="#00645c" class="mt-2 mb-4" size="2" width="100%">
        <ng-container *ngFor="let goal of completedGoals">
          <oppia-goal-list [goalTopic]="goal"></oppia-goal-list>
        </ng-container>
      </div>
    </ng-container>
  </div>
</div>
