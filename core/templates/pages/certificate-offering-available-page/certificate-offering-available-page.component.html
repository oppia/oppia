<!-- TODO(#24717-M2.3): Design UI for available certificate assessment offering -->
<background-banner></background-banner>
<div class="container position-relative oppia oppia-certificate-offering-available-page">
  <div>
    <div>
      <h1 tabindex="0">
        Available certificate offering
      </h1>
    </div>
    <button type="button" class="btn btn-primary oppia-certificate-offering-available-page-exit-button"
            [routerLink]="['/learn', classroomUrlFragment]">
      Exit
    </button>
  </div>

  <section class="oppia-certificate-offering-available-page-panel">
    <div class="oppia-certificate-offering-available-page-tiles">
      <!-- TODO(#24717-M1.19): Wire these CTAs to the learner flow once the
           available certificate assessment page has real navigation targets. -->
      <article class="oppia-certificate-offering-available-page-tile">
        <div class="oppia-certificate-offering-available-page-tile-top">
          <div>
            <h3>Everyday Arithmetic</h3>
            <p class="oppia-certificate-offering-available-page-tile-subtitle">
              Number Confidence
            </p>
          </div>
          <span class="oppia-certificate-offering-available-page-status">
            Not attempted
          </span>
        </div>

        <div class="oppia-certificate-offering-available-page-actions">
          <button type="button" class="btn btn-primary">
            Continue to assessment
          </button>
        </div>
      </article>

      <article class="oppia-certificate-offering-available-page-tile">
        <div class="oppia-certificate-offering-available-page-tile-top">
          <div>
            <h3>Everyday Arithmetic</h3>
            <p class="oppia-certificate-offering-available-page-tile-subtitle">
              Number Confidence
            </p>
          </div>
          <span class="oppia-certificate-offering-available-page-status oppia-certificate-offering-available-page-status--passed">
            Passed
          </span>
        </div>

        <div class="oppia-certificate-offering-available-page-actions">
          <button type="button" class="btn btn-secondary">
            Check score
          </button>
          <button type="button" class="btn btn-primary">
            Retry assessment
          </button>
        </div>
      </article>
    </div>
  </section>
</div>
