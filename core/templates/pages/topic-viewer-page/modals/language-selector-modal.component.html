<div class="topic-language-selector-modal" role="dialog" aria-modal="true" aria-labelledby="topic-language-selector-modal-title">
  <div class="modal-header">
    <h2 class="modal-title" id="topic-language-selector-modal-title">
      Lesson Not Available
    </h2>
    <button type="button" class="close" aria-label="Close" (click)="cancel()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>

  <div class="modal-body">
    <p>
      This lesson is not available in your preferred language ({{ getPreferredLanguageDescription() }}).
      Choose another language to continue.
    </p>

    <topic-lesson-language-selector
      [availableTextLanguageCodes]="availableTextLanguageCodes"
      [availableVoiceoverLanguageCodes]="availableVoiceoverLanguageCodes"
      [selectedTextLanguageCode]="selectedTextLanguageCode"
      [selectedVoiceoverLanguageCode]="selectedVoiceoverLanguageCode"
      [showValidationError]="showValidationError"
      (selectedTextLanguageCodeChange)="selectedTextLanguageCode = $event"
      (selectedVoiceoverLanguageCodeChange)="selectedVoiceoverLanguageCode = $event">
    </topic-lesson-language-selector>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="cancel()">
      Cancel
    </button>
    <button
      type="button"
      class="btn btn-success"
      [disabled]="!selectedTextLanguageCode"
      (click)="startLesson()">
      Start Lesson
    </button>
  </div>
</div>
