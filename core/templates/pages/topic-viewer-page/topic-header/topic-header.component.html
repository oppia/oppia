<div class="topic-header-breadcrumbs" dir="auto">
  <div class="topic-header-breadcrumbs-desktop">
    <span class="crumb"><a [routerLink]="['/learn']">{{ 'I18N_CLASSROOM_TOP_NAV_CLASSROOMS_TEXT' | translate }}</a></span>
    <span class="crumb">
      <i class="fa fa-angle-right" aria-hidden="true" *ngIf="!isLanguageRTL()"></i>
      <i class="fa fa-angle-left" aria-hidden="true" *ngIf="isLanguageRTL()"></i>
    </span>

    <span class="crumb" *ngIf="classroomName">
      <a [routerLink]="getClassroomRouterLink()" class="topic-header-breadcrumbs-link">{{ classroomName }}</a>
    </span>
    <span class="crumb" *ngIf="classroomName">
      <i class="fa fa-angle-right" aria-hidden="true" *ngIf="!isLanguageRTL()"></i>
      <i class="fa fa-angle-left" aria-hidden="true" *ngIf="isLanguageRTL()"></i>
    </span>

    <span class="crumb">
      <span class="topic-header-breadcrumb-current" aria-current="page">{{ topicName }}</span>
    </span>
  </div>
  <div class="topic-header-breadcrumbs-mobile">
     <ng-container *ngIf="classroomName; else backToClassrooms">
       <a [routerLink]="getClassroomRouterLink()" class="e2e-test-mobile-breadcrumbs-classroom">Back to {{ classroomName }}</a>
     </ng-container>
     <ng-template #backToClassrooms>
       <a [routerLink]="['/learn']" class="e2e-test-mobile-breadcrumbs-classroom">{{ 'I18N_BACK_TO_CLASSROOMS' | translate }}</a>
     </ng-template>
  </div>
</div>

<header class="topic-header">
  <h1 class="topic-header-title">{{ topicName }}</h1>
  <p class="topic-header-description">{{ topicDescription }}</p>
</header>
