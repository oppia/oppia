<div class="topic-header-breadcrumbs">
  <div class="topic-header-breadcrumbs-desktop">
    <a href="/learn">{{ 'I18N_CLASSROOM_TOP_NAV_CLASSROOMS_TEXT' | translate }}</a>
    <i class="fa fa-angle-right" aria-hidden="true" *ngIf="classroomName && !isLanguageRTL()"></i>
    <i class="fa fa-angle-left" aria-hidden="true" *ngIf="classroomName && isLanguageRTL()"></i>
    <a *ngIf="classroomName" [href]="getClassroomUrl()">{{ classroomName }}</a>
    <i class="fa fa-angle-right" aria-hidden="true" *ngIf="!isLanguageRTL()"></i>
    <i class="fa fa-angle-left" aria-hidden="true" *ngIf="isLanguageRTL()"></i>
    <span class="topic-header-breadcrumb-current" aria-current="page">{{ topicName }}</span>
  </div>
  <div class="topic-header-breadcrumbs-mobile">
    <i class="fa fa-angle-left" aria-hidden="true" *ngIf="!isLanguageRTL()"></i>
    <i class="fa fa-angle-right" aria-hidden="true" *ngIf="isLanguageRTL()"></i>
    <a *ngIf="classroomName" [href]="getClassroomUrl()">{{ classroomName }}</a>
    <a *ngIf="!classroomName" href="/learn">{{ 'I18N_CLASSROOM_TOP_NAV_CLASSROOMS_TEXT' | translate }}</a>
  </div>
</div>

<header class="topic-header">
  <h1 class="topic-header-title">{{ topicName }}</h1>
  <p class="topic-header-description">{{ topicDescription }}</p>
</header>
