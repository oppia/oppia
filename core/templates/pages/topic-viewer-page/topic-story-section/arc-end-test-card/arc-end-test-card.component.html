<div class="arc-end-test-card"
     [ngStyle]="{'background-color': cardBackgroundColor}"
     [attr.aria-label]="practiceTitle || 'Adventure end test card'">
  <div class="arc-end-test-card-thumbnail">
    <img class="arc-end-test-card-image"
         [src]="resolvedThumbnailUrl"
         alt="{{ getThumbnailAltText() }}"
         title="{{ getThumbnailAltText() }}">
  </div>

  <div class="arc-end-test-card-content">
    <div class="arc-end-test-card-copy">
      <div class="arc-end-test-card-title-row">
        <topic-arc-circle-badge
          [iconName]="'edit'"
          [size]="'sm'"
          [backgroundColor]="'#fff'"
          [borderColor]="cardAccentColor"
          [textColor]="cardAccentColor">
        </topic-arc-circle-badge>
        <h3 class="arc-end-test-card-title">{{ practiceTitle }}</h3>
      </div>
      <p class="arc-end-test-card-description">{{ getResolvedDescription() }}</p>
    </div>

    <div class="arc-end-test-card-actions">
      <button class="arc-end-test-card-practice-button"
              type="button"
              [disabled]="!practiceUrl"
              (click)="navigateTo(practiceUrl)">
        <i class="material-icons">description</i>
        Practice Test
      </button>
    </div>
  </div>
</div>
