<div class="adventure-navigation-container"
     *ngIf="adventureGroups.length > 0"
     [style.top]="isInTopicEditorPreview ? '126px' : '56px'">
  <p *ngIf="hasHorizontalOverflow" class="adventure-navigation-hint">
    <span class="adventure-navigation-hint-arrow">&#8592;</span>
    {{ 'I18N_TOPIC_VIEWER_NAVIGATION_HINT' | translate }}
    <span class="adventure-navigation-hint-arrow">&#8594;</span>
  </p>

  <div class="adventure-navigation-scroll-area">
    <button class="adventure-navigation-arrow adventure-navigation-arrow--left"
            *ngIf="showLeftArrow"
            (click)="scrollLeft()"
            [attr.aria-label]="'I18N_TOPIC_VIEWER_SCROLL_LEFT' | translate"
            type="button">
      <i class="material-icons">chevron_left</i>
    </button>

    <div class="adventure-navigation-wrapper"
         [class.adventure-navigation-wrapper--centered]="!hasHorizontalOverflow"
         [class.adventure-navigation-wrapper--overflow]="hasHorizontalOverflow"
         #scrollWrapper
         (scroll)="onScroll()">
      <div class="adventure-navigation-group" *ngFor="let adventureGroup of adventureGroups; index as adventureIdx">
        <div class="adventure-navigation-group-pill"
             [ngStyle]="{'border-color': adventureGroup.accentColor, 'grid-column': '1 / ' + (adventureGroup.lessons.length + (adventureGroup.showPractice ? 1 : 0) + 1)}">
        </div>

        <topic-adventure-circle-badge *ngFor="let lesson of adventureGroup.lessons; index as i"
                                      [label]="lesson.lessonNumber.toString()"
                                      [iconName]="''"
                                      [size]="'sm'"
                                      [backgroundColor]="isActiveLesson(lesson.lessonNumber) ? adventureGroup.accentColor : '#fff'"
                                      [borderColor]="adventureGroup.accentColor"
                                      [textColor]="isActiveLesson(lesson.lessonNumber) ? '#fff' : adventureGroup.accentColor"
                                      class="adventure-navigation-clickable"
                                      [style.grid-column]="i + 1"
                                      [style.grid-row]="1"
                                      (click)="onLessonClick(lesson.lessonNumber, adventureIdx)"
                                      [attr.aria-label]="'I18N_TOPIC_VIEWER_GO_TO_LESSON' | translate: {lessonNumber: lesson.lessonNumber}"
                                      [attr.title]="'I18N_TOPIC_VIEWER_GO_TO_LESSON' | translate: {lessonNumber: lesson.lessonNumber}"
                                      role="button"
                                      tabindex="0"
                                      (keydown.enter)="onLessonClick(lesson.lessonNumber, adventureIdx)"
                                      (keydown.space)="onLessonClick(lesson.lessonNumber, adventureIdx); $event.preventDefault()">
        </topic-adventure-circle-badge>

        <topic-adventure-circle-badge *ngIf="adventureGroup.showPractice"
                                      [iconName]="getPracticeBadgeIconName()"
                                      [title]="'I18N_TOPIC_VIEWER_PRACTICE_TEST_BUTTON' | translate"
                                      [size]="'sm'"
                                      [backgroundColor]="isActivePractice(adventureGroup.arcId) ? adventureGroup.accentColor : '#fff'"
                                      [borderColor]="adventureGroup.accentColor"
                                      [textColor]="isActivePractice(adventureGroup.arcId) ? '#fff' : adventureGroup.accentColor"
                                      class="adventure-navigation-clickable"
                                      [style.grid-column]="adventureGroup.lessons.length + 1"
                                      [style.grid-row]="1"
                                      (click)="onPracticeClick(adventureGroup.arcId)"
                                      [attr.aria-label]="'I18N_TOPIC_VIEWER_GO_TO_PRACTICE' | translate"
                                      [attr.title]="'I18N_TOPIC_VIEWER_GO_TO_PRACTICE' | translate"
                                      role="button"
                                      tabindex="0"
                                      (keydown.enter)="onPracticeClick(adventureGroup.arcId)"
                                      (keydown.space)="onPracticeClick(adventureGroup.arcId); $event.preventDefault()">
        </topic-adventure-circle-badge>

        <span *ngFor="let lesson of adventureGroup.lessons; index as i"
              class="adventure-navigation-progress-dot"
              [class.adventure-navigation-progress-dot--completed]="lesson.isCompleted"
              [class.adventure-navigation-progress-dot--first]="i === 0"
              [class.adventure-navigation-progress-dot--line-completed]="i > 0 && adventureGroup.lessons[i - 1].isCompleted"
              [style.grid-column]="i + 1"
              [style.grid-row]="2"
              [ngStyle]="{'border-color': (lesson.isCompleted || isActiveLesson(lesson.lessonNumber)) ? '#27a844' : '#c9c9c9'}">
          <i *ngIf="lesson.isCompleted" class="material-icons">check</i>
        </span>

        <span *ngIf="adventureGroup.showPractice"
              class="adventure-navigation-progress-dot"
              [class.adventure-navigation-progress-dot--completed]="adventureGroup.isPracticeCompleted"
              [class.adventure-navigation-progress-dot--line-completed]="isLastLessonCompleted(adventureGroup)"
              [style.grid-column]="adventureGroup.lessons.length + 1"
              [style.grid-row]="2"
              [ngStyle]="{'border-color': (adventureGroup.isPracticeCompleted || isActivePractice(adventureGroup.arcId)) ? '#27a844' : '#c9c9c9'}">
          <i *ngIf="adventureGroup.isPracticeCompleted" class="material-icons">check</i>
        </span>
      </div>

      <div class="adventure-navigation-mastery-group">
        <topic-adventure-circle-badge class="adventure-navigation-mastery"
                                      [iconName]="'emoji_events'"
                                      [size]="'sm'"
                                      [backgroundColor]="'#fff7e8'"
                                      [borderColor]="'#f5a623'"
                                      [textColor]="'#f5a623'"
                                      [class.adventure-navigation-clickable]="true"
                                      (click)="onMasteryClick()"
                                      [attr.aria-label]="'I18N_TOPIC_VIEWER_MASTERY_CHALLENGE_NAV_ARIA_LABEL' | translate"
                                      [attr.title]="'I18N_TOPIC_VIEWER_MASTERY_CHALLENGE_NAV_ARIA_LABEL' | translate"
                                      role="button"
                                      tabindex="0"
                                      (keydown.enter)="onMasteryClick()"
                                      (keydown.space)="onMasteryClick(); $event.preventDefault()">
        </topic-adventure-circle-badge>
      </div>
    </div>

    <button class="adventure-navigation-arrow adventure-navigation-arrow--right"
            *ngIf="showRightArrow"
            (click)="scrollRight()"
            [attr.aria-label]="'I18N_TOPIC_VIEWER_SCROLL_RIGHT' | translate"
            type="button">
      <i class="material-icons">chevron_right</i>
    </button>
  </div>
</div>
