<span [class]="circleClass"
      [attr.aria-label]="label || iconName"
      [ngStyle]="{
        'background-color': backgroundColor,
        'border-color': borderColor,
        color: textColor
      }">
  <i *ngIf="iconName"
     class="material-icons"
     aria-hidden="true">
    {{ iconName }}
  </i>
  <span *ngIf="!iconName" class="adventure-circle-badge-label">
    {{ label }}
  </span>
</span>
