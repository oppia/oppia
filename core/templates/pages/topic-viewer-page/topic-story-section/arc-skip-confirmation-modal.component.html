<section class="arc-skip-confirmation-modal"
         role="dialog"
         aria-modal="true"
         aria-labelledby="arc-skip-confirmation-title"
         tabindex="-1">
  <button type="button"
          class="arc-skip-confirmation-close"
          [attr.aria-label]="'I18N_TOPIC_VIEWER_CLOSE_BUTTON' | translate"
          (click)="cancel()">
    <i class="material-icons" aria-hidden="true">close</i>
  </button>

  <div class="arc-skip-confirmation-icon-wrap" aria-hidden="true">
    <div class="arc-skip-confirmation-icon-circle">
      <i class="material-icons">fast_forward</i>
    </div>
    <span class="arc-skip-confirmation-icon-ray arc-skip-confirmation-icon-ray-one"></span>
    <span class="arc-skip-confirmation-icon-ray arc-skip-confirmation-icon-ray-two"></span>
    <span class="arc-skip-confirmation-icon-ray arc-skip-confirmation-icon-ray-three"></span>
  </div>

  <h3 id="arc-skip-confirmation-title" class="arc-skip-confirmation-title">
    {{ 'I18N_TOPIC_VIEWER_ARC_SKIP_CONFIRMATION_TITLE' | translate: {adventureLabel: adventureLabel} }}
  </h3>
  <p class="arc-skip-confirmation-message">
    {{ confirmationMessage }}
  </p>

  <div class="arc-skip-confirmation-divider" aria-hidden="true"></div>

  <div class="arc-skip-confirmation-actions">
    <button type="button"
            class="arc-skip-confirmation-cancel"
            (click)="cancel()">
      {{ 'I18N_MODAL_CANCEL_BUTTON' | translate }}
    </button>
    <button type="button"
            class="arc-skip-confirmation-proceed"
            (click)="confirm()">
      {{ 'I18N_MODAL_CONTINUE_BUTTON' | translate }}
    </button>
  </div>
</section>
