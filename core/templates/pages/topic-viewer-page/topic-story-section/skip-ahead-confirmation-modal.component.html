<div class="oppia-skip-ahead-modal">
  <button type="button"
          class="oppia-skip-ahead-close"
          title="Close"
          [attr.aria-label]="'I18N_TOPIC_VIEWER_SKIP_AHEAD_CLOSE' | translate"
          (click)="cancel()">
    <span class="oppia-skip-ahead-close-mark" aria-hidden="true">&times;</span>
  </button>

  <div class="oppia-skip-ahead-icon" aria-hidden="true">
    <span class="oppia-skip-ahead-fast-forward" aria-hidden="true">
      <span class="triangle"></span>
      <span class="triangle"></span>
    </span>
    <span class="oppia-skip-ahead-icon-spark spark-one"></span>
    <span class="oppia-skip-ahead-icon-spark spark-two"></span>
    <span class="oppia-skip-ahead-icon-spark spark-three"></span>
  </div>

  <h2 class="oppia-skip-ahead-title">
    {{ 'I18N_TOPIC_VIEWER_SKIP_AHEAD_MODAL_TITLE' | translate:{arcNumber: targetArcNumber} }}
  </h2>

  <p class="oppia-skip-ahead-description">
    {{ 'I18N_TOPIC_VIEWER_SKIP_AHEAD_MODAL_DESCRIPTION' | translate }}
  </p>

  <hr class="oppia-skip-ahead-divider">

  <div class="oppia-skip-ahead-actions">
    <button type="button" class="oppia-skip-ahead-cancel" (click)="cancel()">
      {{ 'I18N_MODAL_CANCEL_BUTTON' | translate }}
    </button>
    <button type="button" class="oppia-skip-ahead-continue" (click)="confirm()">
      {{ 'I18N_MODAL_CONTINUE_BUTTON' | translate }}
    </button>
  </div>
</div>
