<section class="topic-story-section"
         [attr.aria-label]="storyTitle ? ('Story section: ' + storyTitle) : 'Story section'">
  <div class="story-callout-row">
    <img class="story-callout-avatar"
         [src]="oppiaAvatarImageUrl"
         (error)="onAvatarImageError()"
         alt=""
         aria-hidden="true">
    <p *ngIf="storyDescription" class="story-description-bubble">
      <svg width="30" class="left-side-curve" height="24" viewBox="0 0 30 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" [ngStyle]="isLanguageRTL() ? {'transform': 'scaleX(-1)'} : {}">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M0.832031 0C12.8267 5.31326 22.692 13.4676 29.1014 23.3701V0H0.832031Z" fill="white" />
      </svg>
      {{ storyDescription }}
    </p>
  </div>

  <div class="story-card" [attr.aria-label]="storyTitle ? ('Story summary: ' + storyTitle) : 'Story summary'">
    <div class="story-card-header">
      <div class="story-card-header-left">
        <h3 class="story-title"><span class="story-label">Story: </span>"{{ storyTitle }}"</h3>
        <p class="story-meta" [attr.aria-label]="getStoryMetaAriaLabel()">
          {{ getStoryMetaText() }}
        </p>
      </div>
      <div class="story-card-header-right">
        <a class="study-skills-cta" [href]="studyGuideUrl" [attr.aria-label]="'I18N_TOPIC_VIEWER_STUDY_SKILLS_CTA_ARIA_LABEL' | translate: {storyTitle: storyTitle || 'this story'}">
          <img class="study-skills-icon"
               src="/assets/images/icons/study-skills-icon.png"
               alt=""
               aria-hidden="true">
          <span [innerHTML]="'I18N_TOPIC_VIEWER_STUDY_SKILLS_CTA' | translate"></span>
        </a>
      </div>
    </div>

    <div class="story-card-body">
      <topic-adventure-navigation
        [adventureGroups]="adventureNavigationGroups"
        [activeLessonNumber]="activeLessonNumber"
        (lessonSelected)="onNavigationLessonSelected($event)"
        (practiceSelected)="onNavigationPracticeSelected($event)">
      </topic-adventure-navigation>

      <ng-container *ngIf="adventureGroups.length > 0; else flatLessonList">
        <div class="adventure-group" *ngFor="let adventureGroup of visibleAdventureGroups; index as adventureIdx"
             [ngStyle]="{'border-color': adventureGroup.headerBorderColor}">
          <div class="adventure-header" (click)="toggleAdventure(adventureIdx)" role="button" tabindex="0"
               [attr.aria-expanded]="isAdventureExpanded(adventureIdx)"
               [ngStyle]="{'background-color': adventureGroup.headerBackgroundColor}"
               (keydown.enter)="toggleAdventure(adventureIdx)"
               (keydown.space)="toggleAdventure(adventureIdx); $event.preventDefault()">
            <div class="adventure-header-left">
              <div class="adventure-flag-icon" [ngStyle]="{'background-color': adventureGroup.iconBg}">
                <i class="material-icons">menu_book</i>
              </div>
              <div class="adventure-header-text">
                <h4 class="adventure-title">{{ adventureGroup.adventureTitle }}</h4>
                <p class="adventure-completion-text">{{ getAdventureCompletionText(adventureIdx) }}</p>
              </div>
            </div>
            <div class="adventure-chevron-badge" [class.expanded]="isAdventureExpanded(adventureIdx)">
              <i class="material-icons">expand_more</i>
            </div>
          </div>
          <p *ngIf="adventureGroup.adventureDescription && isAdventureExpanded(adventureIdx)" class="adventure-description">
            {{ adventureGroup.adventureDescription }}
          </p>
          <div *ngIf="isAdventureExpanded(adventureIdx)" class="adventure-lessons">
            <div class="story-lesson-card-wrapper"
                 [id]="'lesson-' + lessonCard.lessonNumber"
                 *ngFor="let lessonCard of adventureGroup.lessonCards">
              <topic-lesson-card
                [lessonTitle]="lessonCard.lessonTitle"
                [lessonDescription]="lessonCard.lessonDescription"
                [thumbnailUrl]="lessonCard.thumbnailUrl"
                [startUrl]="lessonCard.startUrl"
                [studyUrl]="studyGuideUrl"
                [practiceUrl]="practiceCard.practiceUrl"
                [lessonNumber]="lessonCard.lessonNumber"
                [adventureAccentColor]="adventureGroup.accentColor"
                [isActiveLesson]="lessonCard.lessonNumber === activeLessonNumber"
                [lessonProgressStatus]="lessonCard.lessonProgressStatus"
                [totalCheckpointsCount]="lessonCard.totalCheckpointsCount"
                [visitedCheckpointsCount]="lessonCard.visitedCheckpointsCount"
                [availableTextLanguageCodes]="lessonCard.availableTextLanguageCodes"
                [availableVoiceoverLanguageCodes]="lessonCard.availableVoiceoverLanguageCodes"
                [availableVoiceoverLanguageAccentDescriptions]="lessonCard.availableVoiceoverLanguageAccentDescriptions"
                [navigatedLessonNumber]="navigatedLessonNumber">
              </topic-lesson-card>
            </div>

            <div class="story-practice-card-wrapper"
                 [id]="'practice-card-' + adventureIdx"
                 *ngIf="shouldShowAdventureEndTestCard(adventureIdx)">
              <topic-adventure-end-test-card
                [practiceTitle]="practiceCard.practiceTitle"
                [practiceDescription]="practiceCard.practiceDescription"
                [relatedLessonNumber]="practiceCard.relatedLessonNumber"
                [thumbnailUrl]="practiceCard.thumbnailUrl"
                [studyUrl]="practiceCard.studyUrl"
                [cardBackgroundColor]="adventureGroup.headerBackgroundColor"
                [cardAccentColor]="adventureGroup.accentColor"
                [practiceUrl]="practiceCard.practiceUrl">
              </topic-adventure-end-test-card>
            </div>
          </div>
        </div>
      </ng-container>

      <ng-template #flatLessonList>
        <div class="story-lesson-card-wrapper"
             [id]="'lesson-' + lessonCard.lessonNumber"
             *ngFor="let lessonCard of lessonCards">
          <topic-lesson-card
            [lessonTitle]="lessonCard.lessonTitle"
            [lessonDescription]="lessonCard.lessonDescription"
            [thumbnailUrl]="lessonCard.thumbnailUrl"
            [startUrl]="lessonCard.startUrl"
            [studyUrl]="studyGuideUrl"
            [practiceUrl]="practiceCard.practiceUrl"
            [lessonNumber]="lessonCard.lessonNumber"
            [adventureAccentColor]="'#00645c'"
            [isActiveLesson]="lessonCard.lessonNumber === activeLessonNumber"
            [lessonProgressStatus]="lessonCard.lessonProgressStatus"
            [totalCheckpointsCount]="lessonCard.totalCheckpointsCount"
            [visitedCheckpointsCount]="lessonCard.visitedCheckpointsCount"
            [availableTextLanguageCodes]="lessonCard.availableTextLanguageCodes"
            [availableVoiceoverLanguageCodes]="lessonCard.availableVoiceoverLanguageCodes"
            [availableVoiceoverLanguageAccentDescriptions]="lessonCard.availableVoiceoverLanguageAccentDescriptions"
            [navigatedLessonNumber]="navigatedLessonNumber">
          </topic-lesson-card>
        </div>

        <div class="story-practice-card-wrapper"
             id="practice-card-flat"
             *ngIf="isPracticeCardVisible">
          <topic-adventure-end-test-card
            [practiceTitle]="practiceCard.practiceTitle"
            [practiceDescription]="practiceCard.practiceDescription"
            [relatedLessonNumber]="practiceCard.relatedLessonNumber"
            [thumbnailUrl]="practiceCard.thumbnailUrl"
            [studyUrl]="practiceCard.studyUrl"
            [cardBackgroundColor]="'#ecf7f6'"
            [cardAccentColor]="'#0b776d'"
            [practiceUrl]="practiceCard.practiceUrl">
          </topic-adventure-end-test-card>
        </div>
      </ng-template>

      <topic-mastery-challenge-card
        [actionUrl]="masteryChallengeUrl">
      </topic-mastery-challenge-card>
    </div>
  </div>
</section>
