<div class="mastery-challenge-card"
     [attr.aria-label]="'I18N_TOPIC_VIEWER_MASTERY_CHALLENGE_BUTTON' | translate">
  <div class="mastery-challenge-icon" aria-hidden="true">
    <img class="mastery-challenge-icon-image"
         src="/assets/images/icons/mastery-challenge-trophy.svg"
         alt=""
         aria-hidden="true">
  </div>
  <div class="mastery-challenge-content">
    <h3 class="mastery-challenge-title">{{ 'I18N_TOPIC_VIEWER_MASTERY_CHALLENGE_BUTTON' | translate }}</h3>
    <p class="mastery-challenge-description">{{ 'I18N_TOPIC_VIEWER_MASTERY_CHALLENGE_DESCRIPTION' | translate }}</p>
  </div>
  <div class="mastery-challenge-action-wrapper">
    <button class="mastery-challenge-button"
            type="button"
            [class.mastery-challenge-button-locked]="!isUnlocked"
            (click)="onChallengeButtonClick()"
            (mouseenter)="onButtonMouseEnter()"
            (mouseleave)="onButtonMouseLeave()">
      <span class="mastery-challenge-button-icon"
            [class.mastery-challenge-button-icon-locked]="!isUnlocked"
            aria-hidden="true">
        <i class="material-icons">{{ isUnlocked ? 'star' : 'lock' }}</i>
      </span>
      <span>{{ 'I18N_TOPIC_VIEWER_MASTERY_CHALLENGE_BUTTON' | translate }}</span>
    </button>

    <section *ngIf="showLockedTooltip"
             class="mastery-challenge-helper-tooltip"
             aria-live="polite"
             [attr.aria-label]="'I18N_TOPIC_VIEWER_MASTERY_CHALLENGE_TOOLTIP_TITLE' | translate">
      <div class="mastery-challenge-helper-icon" aria-hidden="true">
        <i class="material-icons">lightbulb</i>
      </div>
      <div class="mastery-challenge-helper-content">
        <h4 class="mastery-challenge-helper-title">
          {{ 'I18N_TOPIC_VIEWER_MASTERY_CHALLENGE_TOOLTIP_TITLE' | translate }}
        </h4>
        <p class="mastery-challenge-helper-description">
          {{ 'I18N_TOPIC_VIEWER_MASTERY_CHALLENGE_TOOLTIP_DESCRIPTION' | translate }}
        </p>
      </div>
    </section>
  </div>
</div>
