<div class="topic-lesson-card"
     [attr.aria-label]="lessonTitle || 'Lesson card'"
     [class.collapsed]="!isExpanded"
     [class.coming-soon-section-card]="isComingSoonSectionCard">
  <div class="topic-lesson-card-thumbnail" *ngIf="isExpanded"
       [ngStyle]="{'background-color': adventureAccentColor}">
    <img class="topic-lesson-card-image"
         [src]="resolvedThumbnailUrl"
         alt="{{ getThumbnailAltText() }}">
  </div>
  <div class="topic-lesson-card-content" [class.collapsed]="!isExpanded">
    <div class="topic-lesson-card-copy">
      <div class="topic-lesson-card-title-row" [class.collapsed]="!isExpanded">
        <topic-adventure-circle-badge [label]="lessonNumber.toString()"
                                      [size]="'sm'"
                                      [backgroundColor]="isExpanded ? adventureAccentColor : '#fff'"
                                      [borderColor]="isExpanded ? adventureAccentColor : '#d1d5db'"
                                      [textColor]="isExpanded ? '#fff' : '#6b7280'">
        </topic-adventure-circle-badge>
        <div class="topic-lesson-card-header">
          <div class="topic-lesson-card-title-with-labels">
            <h3 class="topic-lesson-card-title">{{ lessonTitle }}</h3>
            <span class="topic-lesson-card-new-label" *ngIf="isNewLessonLabelVisible">
              {{ 'I18N_TOPIC_VIEWER_LESSON_NEW_LABEL' | translate }}
            </span>
            <span class="topic-lesson-card-coming-soon-label" *ngIf="isComingSoonLesson">
              {{ 'I18N_TOPIC_VIEWER_LESSON_COMING_SOON_LABEL' | translate }}
            </span>
          </div>
          <p class="topic-lesson-card-description" *ngIf="isExpanded || isComingSoonSectionCard">
            {{ isComingSoonLesson ? ('I18N_LEARNER_STORY_TILE_COMING_SOON_TOOLTIP' | translate) : lessonDescription }}
          </p>
        </div>
        <button class="topic-lesson-card-chevron-badge"
                type="button"
                [class.expanded]="isExpanded"
                [class.disabled-chevron]="isComingSoonSectionCard"
                [disabled]="isComingSoonSectionCard"
                (click)="toggleExpanded()"
                [attr.aria-expanded]="isExpanded"
                [attr.aria-label]="'I18N_TOPIC_VIEWER_TOGGLE_LESSON_DETAILS' | translate">
          <i class="material-icons" aria-hidden="true">expand_more</i>
        </button>
      </div>
    </div>
    <div class="topic-lesson-card-footer"
         [class.collapsed]="!isExpanded"
         [class.coming-soon-footer]="isComingSoonSectionCard">
      <div class="topic-lesson-card-progress" *ngIf="showCheckpointBar">
        <oppia-checkpoint-bar
          [totalCheckpointsCount]="totalCheckpointsCount"
          [visitedCheckpointsCount]="visitedCheckpointsCount"
          [isReadOnly]="true">
        </oppia-checkpoint-bar>
      </div>
      <div class="topic-lesson-card-actions">
        <div class="topic-lesson-card-actions-left">
          <span
                class="topic-lesson-card-fallback-info-icon"
                *ngIf="shouldShowFallbackCta() && !isComingSoonLesson"
                [matTooltip]="getFallbackInfoTooltipText()"
                tabindex="0">
            <i class="material-icons">info_outline</i>
          </span>
          <topic-lesson-language-selector class="topic-lesson-language-selector"
            *ngIf="shouldShowInfoIcon && !isComingSoonLesson"
            [availableTextLanguageCodes]="availableTextLanguageCodes"
            [availableVoiceoverLanguageCodes]="availableVoiceoverLanguageCodes"
            [voiceoverLanguageAccentDescriptions]="availableVoiceoverLanguageAccentDescriptions"
            [selectedTextLanguageCode]="selectedTextLanguageCode"
            [selectedVoiceoverLanguageCode]="selectedVoiceoverLanguageCode"
            (selectedTextLanguageCodeChange)="onSelectedTextLanguageCodeChange($event)"
            (selectedVoiceoverLanguageCodeChange)="onSelectedVoiceoverLanguageCodeChange($event)">
          </topic-lesson-language-selector>
        </div>
        <div class="topic-lesson-card-actions-right">
          <div class="topic-lesson-card-secondary-buttons">
            <button class="topic-lesson-card-secondary-button"
                    type="button"
                    [disabled]="isComingSoonLesson || (!practiceUrl && !startUrl)"
                    (click)="onPracticeButtonClick()">
              <i class="material-icons topic-lesson-card-btn-icon" aria-hidden="true">edit</i>
              {{ 'I18N_TOPIC_VIEWER_PRACTICE_BUTTON' | translate }}
            </button>
            <button class="topic-lesson-card-secondary-button"
                    type="button"
                    [disabled]="isComingSoonLesson || (!studyUrl && !startUrl)"
                    (click)="onStudyButtonClick()">
              <i class="material-icons topic-lesson-card-btn-icon" aria-hidden="true">menu_book</i>
              {{ 'I18N_TOPIC_VIEWER_STUDY_BUTTON' | translate }}
            </button>
          </div>
          <button class="topic-lesson-card-start-button"
                  type="button"
                  [disabled]="isComingSoonLesson || !startUrl"
                  (click)="onStartButtonClick()">
            <i class="material-icons topic-lesson-card-btn-icon" aria-hidden="true">play_arrow</i>
            {{ 'I18N_TOPIC_VIEWER_PLAY_LESSON_BUTTON' | translate }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
