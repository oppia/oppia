<div class="topic-lesson-language-selector-row topic-lesson-language-selector-row--compact">
  <div class="topic-lesson-language-selector-select-container">
    <i class="fas fa-file-alt topic-lesson-language-selector-leading-icon"
       aria-hidden="true">
    </i>
    <div class="topic-lesson-language-selector-text-block">
      <span class="topic-lesson-language-selector-chip-label">Text</span>
      <span class="topic-lesson-language-selector-selected-value">
        {{ selectedTextLanguageCode ? getLanguageDescription(selectedTextLanguageCode) : 'Select' }}
      </span>
    </div>

    <select
            id="topic-lesson-text-language"
            class="topic-lesson-language-selector-select e2e-test-topic-lesson-text-language-selector"
            [ngModel]="selectedTextLanguageCode"
            (ngModelChange)="onTextLanguageChange($event)"
            aria-label="Text language selector"
            required>
      <option *ngFor="let textLanguageCode of availableTextLanguageCodes"
              [value]="textLanguageCode">
        {{ getLanguageDescription(textLanguageCode) }}
      </option>
    </select>

    <i class="fa fa-angle-down topic-lesson-language-selector-trailing-icon"
       aria-hidden="true">
    </i>
  </div>

  <div class="topic-lesson-language-selector-select-container">
    <i class="fa fa-headphones topic-lesson-language-selector-leading-icon"
       aria-hidden="true">
    </i>
    <div class="topic-lesson-language-selector-text-block">
      <span class="topic-lesson-language-selector-chip-label">Audio</span>
      <span class="topic-lesson-language-selector-selected-value">
        {{ getSelectedVoiceoverLanguageLabel() }}
      </span>
    </div>

    <select
            id="topic-lesson-voiceover-language"
            class="topic-lesson-language-selector-select e2e-test-topic-lesson-voiceover-language-selector"
            [ngModel]="getValidSelectedVoiceoverLanguageCode()"
            (ngModelChange)="onVoiceoverLanguageChange($event)"
            aria-label="Voiceover language selector"
            [disabled]="!hasVoiceoverLanguageOptions()">
      <option
              *ngFor="let voiceoverLanguageCode of filteredVoiceoverLanguageCodes"
              [value]="voiceoverLanguageCode">
        {{ getLanguageDescription(voiceoverLanguageCode) }}
      </option>
    </select>

    <i class="fa fa-angle-down topic-lesson-language-selector-trailing-icon"
       aria-hidden="true">
    </i>
  </div>
</div>

<p
   class="topic-lesson-language-selector-note"
   *ngIf="shouldShowNoAccentsMessage()"
   aria-live="polite">
  No accents available for selected text language.
</p>

<p
   class="topic-lesson-language-selector-error"
   *ngIf="shouldShowTextLanguageValidationError()"
   id="topic-lesson-text-language-error"
   aria-live="assertive">
  Choose a text language to continue.
</p>
