<div class="arc-navigation-container" *ngIf="arcGroups.length > 0">
  <div class="arc-navigation-scroll-area">
    <button
      class="arc-navigation-arrow arc-navigation-arrow--left"
      *ngIf="showLeftArrow"
      (click)="scrollLeft()"
      aria-label="Scroll left"
      type="button">
      <i class="material-icons">chevron_left</i>
    </button>

    <div class="arc-navigation-wrapper" #scrollWrapper (scroll)="onScroll()">
      <div class="arc-navigation-group" *ngFor="let arcGroup of arcGroups; index as arcIdx"
           [ngStyle]="{'border-color': arcGroup.accentColor}">
        <topic-arc-circle-badge
          *ngFor="let lessonNumber of arcGroup.lessonNumbers"
          [label]="lessonNumber.toString()"
          [size]="'sm'"
          [backgroundColor]="isActiveLesson(lessonNumber) ? arcGroup.accentColor : '#fff'"
          [borderColor]="arcGroup.accentColor"
          [textColor]="isActiveLesson(lessonNumber) ? '#fff' : arcGroup.accentColor"
          class="arc-navigation-clickable"
          (click)="onLessonClick(lessonNumber)"
          [attr.aria-label]="'Go to lesson ' + lessonNumber"
          role="button"
          tabindex="0"
          (keydown.enter)="onLessonClick(lessonNumber)"
          (keydown.space)="onLessonClick(lessonNumber); $event.preventDefault()">
        </topic-arc-circle-badge>

        <topic-arc-circle-badge
          [iconName]="'edit'"
          [size]="'sm'"
          [backgroundColor]="'#fff'"
          [borderColor]="arcGroup.accentColor"
          [textColor]="arcGroup.accentColor"
          class="arc-navigation-clickable"
          (click)="onPracticeClick(arcIdx)"
          [attr.aria-label]="'Go to practice'"
          role="button"
          tabindex="0"
          (keydown.enter)="onPracticeClick(arcIdx)"
          (keydown.space)="onPracticeClick(arcIdx); $event.preventDefault()">
        </topic-arc-circle-badge>
      </div>

      <topic-arc-circle-badge
        class="arc-navigation-mastery"
        [iconName]="'emoji_events'"
        [size]="'sm'"
        [backgroundColor]="'#fff7e8'"
        [borderColor]="'#f5a623'"
        [textColor]="'#f5a623'">
      </topic-arc-circle-badge>
    </div>

    <button
      class="arc-navigation-arrow arc-navigation-arrow--right"
      *ngIf="showRightArrow"
      (click)="scrollRight()"
      aria-label="Scroll right"
      type="button">
      <i class="material-icons">chevron_right</i>
    </button>
  </div>

  <p class="arc-navigation-hint">
    <span class="arc-navigation-hint-arrow">&#8592;</span>
    Click to navigate through lessons and tests
    <span class="arc-navigation-hint-arrow">&#8594;</span>
  </p>
</div>
