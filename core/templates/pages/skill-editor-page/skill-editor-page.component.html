<div class="e2e-test-skill-editor-container">
  <div class="skill-editor-main">
    <div class="navbar-helper">
      <div class="navbar-text">
        Skill Editor
      </div>
      <div class="navbar-tabs navbar-icons">
        <ul>
          <li [ngClass]="{'dropdown': getWarningsCount(), 'navbar-tab-active': getActiveTabName() === 'main'}"
              (click)="selectMainTab()"
              class="navbar-tab nav-list-item">
            <a ngbTooltip="Main Editor"
               placement="bottom"
               class="e2e-test-main-tab">
              <i class="fas fa-pen navbar-tab-icon"
                [ngClass]="{'navbar-tab-active-icon': getActiveTabName() === 'main'}">
              </i>
            </a>
            <div [hidden]="!getWarningsCount()"
                 class="oppia-editor-warnings-indicator oppia-editor-warnings-error-color"
                 (mouseover)="warningsAreShown"
                 (mouseleave)="!warningsAreShown">
              <span class="oppia-editor-warnings-count">
                {{getWarningsCount()}}
              </span>
            </div>
            <ul ngbDropdownMenu
                class="dropdown-menu oppia-editor-warnings-box skill-editor-warning-box"
                *ngIf="warningsAreShown">
              <span class="oppia-editor-warnings-header">Warnings</span>
              <li class="oppia-editor-warnings-text"
                  *ngFor="let issue of skill.getValidationIssues(); trackBy : index">
                <hr class="oppia-editor-warnings-separator">
                {{issue}}
              </li>
            </ul>
          </li>
          <li class="navbar-tab icon nav-list-item e2e-test-questions-tab"
              [ngClass]="{'navbar-tab-active': getActiveTabName() === 'questions'}"
              (click)="selectQuestionsTab()">
            <a ngbTooltip="Questions"
               placement="bottom">
              <i class="fas fa-book-open navbar-tab-icon"
                [ngClass]="{'navbar-tab-active-icon': getActiveTabName() === 'questions'}">
              </i>
            </a>
          </li>
          <li class="navbar-tab icon nav-list-item e2e-test-question-preview-tab"
              [ngClass]="{'navbar-tab-active': getActiveTabName() === 'preview'}"
              (click)="selectPreviewTab()" >
            <a class="nav-link"
               ngbTooltip="Preview"
               placement="bottom">
              <i class="fas fa-play navbar-tab-icon"
                [ngClass]="{'navbar-tab-active-icon': getActiveTabName() === 'preview'}">
              </i>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <div *ngIf="getActiveTabName() === 'main'">
    <oppia-skill-editor-main-tab></oppia-skill-editor-main-tab>
  </div>

  <div *ngIf="getActiveTabName() === 'questions'">
    <oppia-questions-tab></oppia-questions-tab>
  </div>

  <div *ngIf="getActiveTabName() === 'preview'">
    <oppia-skill-preview-tab></oppia-skill-preview-tab>
  </div>
</div>
