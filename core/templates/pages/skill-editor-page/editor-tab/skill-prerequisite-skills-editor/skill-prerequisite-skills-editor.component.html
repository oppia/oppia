<div class="oppia-editor-card-with-avatar oppia-mobile-collapsible-card">
  <div class="oppia-editor-card-body">
    <div class="oppia-editor-card-section prerequisite-skill-content">
      <div class="oppia-prerequisite-skills-header oppia-mobile-collapsible-card-header e2e-test-toggle-prereq-skills-dropdown" (click)="togglePrerequisiteSkills()">
        <strong class="heading-text">
          Prerequisite Skills
        </strong>
        <i class="fa fa-caret-down"
           *ngIf="!prerequisiteSkillsAreShown"
           aria-hidden="true">
        </i>
        <i class="fa fa-caret-up"
           *ngIf="prerequisiteSkillsAreShown"
           aria-hidden="true">
        </i>
      </div>
      <div *ngIf="prerequisiteSkillsAreShown" class="oppia-mobile-collapsible-card-content e2e-test-skill-editor-collapsible-card">
        <div class="skill-id mat-card"  *ngFor="let skillId of skill.getPrerequisiteSkillIds(); index as i">
          <div class="skill-description-card">
            <span class="remove-skill-icon" (click)="removeSkillId(skillId)" aria-hidden="true">
              <i class="material-icons md-18">&#xE14C;</i>
            </span>
            <a class="skill-prerequisite-link" [href]="getSkillEditorUrl(skillId)" target="_blank" rel="noopener">{{getSkillDescription(skillId)}}</a>
          </div>
        </div>
        <button class="btn skill-editor-add-btn oppia-add-prerequisite-skill-button e2e-test-add-prerequisite-skill-in-skill-editor-button" (click)="addSkill()">+ ADD PREREQUISITE SKILL</button>
      </div>
    </div>
  </div>
</div>
