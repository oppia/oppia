<div class="modal-header">
  <h4
      class="modal-title"
      [innerHTML]="'I18N_MODAL_REPLACE_TRANSLATION_TITLE' | translate"
  ></h4>
</div>
<div class="modal-body">
  <p [innerHTML]="'I18N_MODAL_REPLACE_TRANSLATION_BODY' | translate"></p>
  <div class="oppia-auto-translation-comparison">
    <section class="oppia-auto-translation-comparison-panel">
      <h5
        [innerHTML]="'I18N_MODAL_REPLACE_TRANSLATION_CURRENT_TEXT' | translate"
      ></h5>
      <oppia-rte-output-display
        [rteString]="currentTranslation"
      ></oppia-rte-output-display>
    </section>
    <section class="oppia-auto-translation-comparison-panel">
      <h5
        [innerHTML]="
          'I18N_MODAL_REPLACE_TRANSLATION_AUTO_GENERATED_TEXT' | translate
        "
      ></h5>
      <oppia-rte-output-display
        [rteString]="autoGeneratedTranslation"
      ></oppia-rte-output-display>
    </section>
  </div>
</div>
<div class="modal-footer">
  <button
          class="btn btn-secondary e2e-test-keep-current-translation-button"
          (click)="keepMine()"
          [innerHTML]="'I18N_MODAL_REPLACE_TRANSLATION_KEEP_MINE_BUTTON' | translate"
  >
  </button>
  <button
          class="btn btn-primary e2e-test-replace-current-translation-button"
          (click)="replaceWithAutoGenerated()"
          [innerHTML]="'I18N_MODAL_REPLACE_TRANSLATION_REPLACE_BUTTON' | translate"
  >
  </button>
</div>
