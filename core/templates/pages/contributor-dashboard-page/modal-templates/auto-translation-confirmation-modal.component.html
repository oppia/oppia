<div class="modal-header">
  <h4 class="modal-title">Replace your translation?</h4>
</div>
<div class="modal-body">
  <p>
    You have already typed a translation. Clicking Replace will overwrite it
    with the auto-generated suggestion.
  </p>
  <div class="oppia-auto-translation-comparison">
    <section class="oppia-auto-translation-comparison-panel">
      <h5>Your current text</h5>
      <oppia-rte-output-display
        [rteString]="currentTranslation"
      ></oppia-rte-output-display>
    </section>
    <section class="oppia-auto-translation-comparison-panel">
      <h5>Auto-generated text</h5>
      <oppia-rte-output-display
        [rteString]="autoGeneratedTranslation"
      ></oppia-rte-output-display>
    </section>
  </div>
</div>
<div class="modal-footer">
  <button
    class="btn btn-secondary e2e-test-keep-current-translation-button"
    (click)="keepMine()"
  >
    Keep mine
  </button>
  <button
    class="btn btn-primary e2e-test-replace-current-translation-button"
    (click)="replaceWithAutoGenerated()"
  >
    Replace with auto-generated
  </button>
</div>
