<div class="modal-body">
  <p>
    It looks like your translation contains a math formula written as plain text. In Right-to-Left (RTL) languages, plain-text formulas can break and render out of order.
  </p>
  <p>
    Are you sure you want to save anyway, or would you like to continue editing and use the <strong>Math Formula component</strong> instead?
  </p>
</div>
<div class="modal-footer">
  <button class="btn btn-secondary e2e-test-continue-editing-button" (click)="cancel()">Continue Editing</button>
  <button class="btn btn-success e2e-test-save-anyway-button" (click)="confirm()">Save Anyway</button>
</div>
