<div #dropdown class="oppia-entity-type-selector-container e2e-test-entity-type-selector">
  <div class="oppia-entity-type-selector-inner-container e2e-test-entity-type-selector-selected"
       tabindex="0"
       (keydown.enter)="toggleDropdown($event)"
       (click)="toggleDropdown($event)">
    {{ getActiveEntityTypeLabel() }}
    <span class="fas fa-caret-down oppia-entity-type-selector-inner-container-arrow"
          [ngStyle]="{ 'transform': dropdownShown ? 'scaleY(-1)' : 'scaleY(1)' }">
    </span>
  </div>

  <div *ngIf="dropdownShown" class="oppia-entity-type-selector-dropdown-container e2e-test-entity-type-selector-dropdown">
    <div class="oppia-entity-type-selector-dropdown-option e2e-test-entity-type-selector-option"
         *ngFor="let option of entityTypeOptions"
         (click)="selectOption(option.id, $event)"
         (keydown.enter)="selectOption(option.id, $event)"
         tabindex="0"
         [ngClass]="{'oppia-entity-type-selector-dropdown-option-selected' : option.id === activeEntityType}">
      {{ option.label }}
    </div>
  </div>
</div>

<style>
  .oppia-entity-type-selector-container {
    background-color: #fff;
    border-radius: 4px;
    box-shadow: 0 0 4px rgba(0, 0, 0, 0.25);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    padding: 10px 20px;
    position: relative;
    width: 100%;
  }

  .oppia-entity-type-selector-inner-container {
    display: flex;
    flex: 1;
    justify-content: space-between;
  }

  .oppia-entity-type-selector-inner-container-arrow {
    color: #009688;
    cursor: pointer;
    padding-top: 3px;
  }

  .oppia-entity-type-selector-dropdown-container {
    background-color: #fff;
    border-radius: 4px;
    box-shadow: 0 0 4px rgba(0, 0, 0, 0.25);
    left: 0;
    padding: 8px 12px;
    position: absolute;
    right: 0;
    top: 100%;
    z-index: 1;
  }

  .oppia-entity-type-selector-dropdown-option {
    color: rgb(104, 104, 104);
    display: flex;
    flex: 1;
    padding: 8px;
  }

  .oppia-entity-type-selector-dropdown-option-selected,
  .oppia-entity-type-selector-dropdown-option:hover {
    background-color: rgb(238, 238, 238);
    border-radius: 4px;
  }

  @media screen and (max-width: 700px) {
    .oppia-entity-type-selector-inner-container {
      font-size: 18px;
    }
  }
</style>
