<oppia-titled-background-banner [title]="'I18N_CERTIFICATE_ASSESSMENT'"
                                [buttonText]="'I18N_CERTIFICATE_ASSESSMENT_BACK_BUTTON'"
                                [buttonRoute]="['/learn', classroomUrlFragment, 'certificate-offering-available']">
</oppia-titled-background-banner>
<div class="intro-card-container">
  <div class="intro-card">
    <h1 class="certificate-title">{{ certificateOffering.title | titlecase }}</h1>
    <p class="certificate-description">{{ certificateOffering.description }}</p>
    <div class="demonstrates-box">
      <p class="demonstrates-heading">{{ demonstratesHeadingI18nKey | translate }}</p>
      <ul class="demonstrates-list">
        <li *ngFor="let item of certificateOffering.demonstrates">{{ item | titlecase }}</li>
      </ul>
    </div>

    <div class="cta-row">
      <button type="button" class="continue-button e2e-test-continue-button" (click)="onContinue()">
            {{ continueButtonI18nKey | translate }}
      </button>
    </div>
  </div>
</div>
