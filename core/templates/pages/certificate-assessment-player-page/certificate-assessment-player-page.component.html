<div class="certificate-assessment-page-container position-relative">
  <oppia-assessment-interrupt #interruptCard
                              *ngIf="showAssessmentInterruptCard"
                              (retryAssessment)="onRetryAssessment()"
                              (resumeAssessment)="onResumeAssessment()">
  </oppia-assessment-interrupt>

  <oppia-assessment-introduction-card #introCard
                                      *ngIf="currentStage === certificateAssessmentPlayerPageConstants.STAGE_INTRO"
                                      [certificateId]="certificateId"
                                      (continue)="showInstructions()">
  </oppia-assessment-introduction-card>

  <oppia-assessment-instruction-panel *ngIf="currentStage === certificateAssessmentPlayerPageConstants.STAGE_INSTRUCTIONS"
                                      (startAssessment)="startAssessment()">
  </oppia-assessment-instruction-panel>

  <oppia-certificate-assessment-conversation-skin #conversationSkin
                                                  *ngIf="currentStage === certificateAssessmentPlayerPageConstants.STAGE_QUESTIONS"
                                                  [currentQuestion]="getCurrentQuestion()"
                                                  [currentQuestionIndex]="currentQuestionIndex"
                                                  [totalQuestions]="mockQuestions.length"
                                                  [progressPercentage]="getProgressPercentage()"
                                                  [isLastQuestion]="currentQuestionIndex === mockQuestions.length - 1"
                                                  (nextQuestion)="nextQuestion()"
                                                  (submitAssessment)="submitAssessment()">
  </oppia-certificate-assessment-conversation-skin>

  <oppia-certificate-assessment-result-card *ngIf="currentStage === certificateAssessmentPlayerPageConstants.STAGE_RESULT"
                                            [certificateId]="certificateId">
  </oppia-certificate-assessment-result-card>
</div>
