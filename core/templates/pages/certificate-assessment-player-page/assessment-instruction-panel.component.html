<div class="intro-card-container">
  <div class="intro-card">
    <h1 class="certificate-title">{{ certificateTitle }}</h1>

    <p class="instructions-heading">{{ instructionsHeading }}</p>

    <ul class="instructions-list">
      <li *ngFor="let instruction of instructions">{{ instruction }}</li>
    </ul>

    <div class="cta-row">
      <button
        type="button"
        class="continue-button"
        (click)="onStartAssessment()">
        Start Assessment
      </button>
    </div>
  </div>
</div>
