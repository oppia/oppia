<oppia-titled-background-banner [title]="bannerTitleI18nKey"
                                [buttonText]="bannerButtonI18nKey"
                                (bannerClick)="onBack()">
</oppia-titled-background-banner>
<div class="intro-card-container">
  <div class="intro-card">
    <h1 class="certificate-title">{{ certificateTitle | titlecase }}</h1>

    <p class="instructions-heading">
      {{ instructionsHeadingI18nKey | translate }}
    </p>

    <ul class="instructions-list">
      <li>
        {{ timeLimitInstructionI18nKey | translate: { minutes: timeLimitInMinutes } }}
      </li>
      <li>
        {{ questionCountInstructionI18nKey | translate: { questions: totalQuestions } }}
      </li>
      <li *ngFor="let instructionKey of staticInstructionI18nKeys">
        {{ instructionKey | translate }}
      </li>
    </ul>

    <div class="cta-row">
      <button type="button" class="continue-button"
              (click)="onStartAssessment()">
        {{ startAssessmentButtonI18nKey | translate }}
      </button>
    </div>
  </div>
</div>
