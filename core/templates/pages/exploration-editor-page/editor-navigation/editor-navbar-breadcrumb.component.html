<ul class="oppia-navbar-breadcrumb">
  <li>
    <span class="oppia-navbar-breadcrumb-separator"></span>
    <span *ngIf="navbarTitle">
      {{navbarTitle}}
      <span class="oppia-navbar-breadcrumb-separator oppia-navbar-breadcrumb-separator-icon"></span>
      <span>
        {{getCurrentTabName()}}
      </span>
    </span>
    <span *ngIf="navbarTitle === ''" (click)="editTitle()" class="oppia-untitled-exploration-text">
      Untitled Exploration
    </span>
    <span class="e2e-test-loading-message" *ngIf="navbarTitle === null">
      Loading...
    </span>
  </li>
</ul>
<style>
  ul {
    padding-left: 0;
  }
  editor-navbar-breadcrumb .oppia-navbar-breadcrumb-separator-icon {
    margin-left: 5px;
  }
  editor-navbar-breadcrumb .oppia-untitled-exploration-text {
    opacity: 0.8;
  }
</style>
