<div class="modal-header">
  <h3 class="oppia-remove-role-confirmation-modal-header e2e-test-modal-header">Are you sure?</h3>
</div>

<div class="modal-body oppia-remove-role-confirmation-modal-body">
  <p>Are you sure you want to remove <strong>{{username}}</strong> from the role of <strong>{{role}}</strong>?</p>
</div>

<div class="modal-footer">
  <button class="btn btn-secondary e2e-test-cancel-action-button" (click)="cancel()">Cancel</button>
  <button class="btn btn-danger e2e-test-really-delete-exploration-button e2e-test-confirm-action-button" (click)="confirm()">Remove user</button>
</div>
