<div class="modal-header e2e-test-add-study-guide-section-modal">
  <h3>Add Section</h3>
</div>

<div class="modal-body">
  <form name="addStudyGuideSectionForm.studyGuideSectionTextForm"
        class="form-inline">
    <div class="oppia-rule-details-header">
      <div class="section-heading-and-content-section">
        <strong>Heading</strong>
        <schema-based-editor class="e2e-test-study-guide-section-heading"
                             [schema]="getHeadingSchema()"
                             [localValue]="tmpSectionHeadingHtml"
                             (localValueChange)="this.updateLocalHeading($event)">
        </schema-based-editor>
      </div>
      <div class="section-heading-and-content-section">
        <strong>Content</strong>
        <schema-based-editor class="e2e-test-study-guide-section-content"
                             [schema]="getContentSchema()"
                             [localValue]="tmpSectionContentHtml"
                             (localValueChange)="this.updateLocalContent($event)">
        </schema-based-editor>
      </div>
    </div>
  </form>
</div>

<div class="modal-footer">
  <button class="btn btn-secondary" (click)="cancel()" type="button">Cancel</button>
  <button class="btn btn-success e2e-test-save-study-guide-section-button"
          (click)="saveSection()"
          [disabled]="!(tmpSectionHeadingPlaintext && tmpSectionContentHtml)">
  Save
  </button>
</div>
<style>
  .section-heading-and-content-section {
    margin-top: 2.5vh;
  }
  .oppia-new-study-guide-editable-field {
    font-size: 12px;
  }
</style>
