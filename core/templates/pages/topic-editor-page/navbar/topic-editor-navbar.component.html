<ul class="oppia-navbar-desktop nav navbar-nav oppina-navbar-nav float-end"
    *ngIf="topic && topicRights.canEditTopic()">
  <li class="oppia-navbar-dropdown-menu d-inline-flex align-items-center">
    <div class="d-inline-block position-relative">
      <span [matTooltip]="getAllTopicWarnings()"
            matTooltipClass="oppia-mat-tooltip-list"
            [matTooltipDisabled]="isWarningTooltipDisabled()"
            aria-label="List that shows issues preventing to save changes to the topic"
            class="w-100">
        <button type="button"
                class="btn btn-light oppia-save-changes-button e2e-test-save-topic-button float-start"
                [ngClass]="{'btn-success': topicIsSaveable}"
                (click)="saveChanges()"
                [disabled]="!topicIsSaveable">
          <span *ngIf="!isSaveInProgress()">
            <i class="fas fa-save md-18 md-dark oppia-save-publish-button-icon oppia-topic-editor-save-icon"
               alt="Save Topic">
            </i>
            <span class="oppia-save-publish-button-label float-start">Save Changes</span>
            <span class="d-none d-md-block float-start oppia-change-count"
                  *ngIf="changeListLength">
              ({{ changeListLength }})
            </span>
          </span>

          <span *ngIf="isSaveInProgress()">
            <span class="oppia-save-publish-button-label">Saving</span>
            <loading-dots></loading-dots>
          </span>
        </button>
      </span>
      <div ngbDropdown class="d-inline-block">
        <button type="button"
                class="btn btn-light dropdown-toggle dropdown-toggle oppia-dropdown-toggle-button"
                [disabled]="!changeListLength"
                aria-label="Dropdown toggle"
                ngbDropdownToggle>
        </button>
        <ul ngbDropdownMenu role="menu"
            class="oppia-dropdown-menu"
            [ngStyle]="{ width: changeListLength && topicRights.isPublished() ? '150px' : '120px' }">
          <li title="Discard all pending changes">
            <a (click)="discardChanges()"
               [ngClass]="{'oppia-disabled-link': !changeListLength}"
               class="dropdown-item">
              Discard Draft
            </a>
          </li>
        </ul>
      </div>
    </div>
  </li>
  <li class="oppia-editor-publish-button-container">
    <button type="button"
            *ngIf="!topicRights.isPublished()"
            class="btn btn-light oppia-editor-publish-button e2e-test-publish-topic-button"
            (click)="publishTopic()"
            [ngClass]="{'btn-success': !isTopicSaveable() && getWarningsCount() === 0 && prepublishValidationIssues.length === 0}"
            [disabled]="isTopicSaveable() || getWarningsCount() > 0 || prepublishValidationIssues.length > 0">
      <i class="fas fa-cloud-upload-alt md-18 md-dark oppia-save-publish-button-icon"
         alt="Publish to Oppia Library">
      </i>
      <span class="oppia-save-publish-button-label">
        Publish Topic
      </span>
    </button>
    <button type="button"
            (click)="unpublishTopic()"
            *ngIf="topicRights.isPublished() && topicRights.canPublishTopic()"
            class="btn btn-light e2e-test-unpublish-topic-button"
            [disabled]="isTopicSaveable()">
      Unpublish Topic
    </button>
  </li>
</ul>
<div class="oppia-topic-nav-mobile" *ngIf="topic">
  <div class="oppia-topic-navbar-mobile-tabs">
    <div class="oppia-topic-nav-dropdown-container">
      <div class="oppia-topic-nav-topic-nav-dropdown-options"
           *ngIf="showNavigationOptions">
        <div class="oppia-topic-nav-dropdown-option" (click)="selectMainTab()">
          <i class="fas fa-pen"></i><span>Editor</span>
        </div>
        <div *ngIf="getActiveTabName() !== 'subtopic_preview' && getActiveTabName() !== 'subtopic_editor'"
             class="oppia-topic-nav-dropdown-option e2e-test-mobile-questions-tab" (click)="selectQuestionsTab()">
          <i class="fas fa-book-open"></i><span>Questions</span>
        </div>
        <div class="oppia-topic-nav-dropdown-option e2e-test-mobile-preview-tab" (click)="openTopicViewer()">
          <i class="fas fa-play"></i><span>Preview</span>
        </div>
      </div>
      <div>
        <div *ngIf="warningsAreShown" class="oppia-warning-box">
          <span>Warnings</span>
          <div *ngFor="let issue of validationIssues">
            <hr class="oppia-editor-warnings-separator">
            {{ issue }}
          </div>
          <div *ngFor="let issue of prepublishValidationIssues">
            <hr class="oppia-editor-warnings-separator">
            {{ issue }}
          </div>
        </div>
      </div>
      <div class="oppia-topic-nav-dropdown-content">
        <div class="oppia-topic-nav-dropdown-text" (click)="toggleWarningText()">
          <i *ngIf="!getTotalWarningsCount() && (getActiveTabName() === 'main' || getActiveTabName() === 'subtopic_editor')"
             class="fas fa-pen">&#xE254;
          </i>
          <i *ngIf="!getTotalWarningsCount() && getActiveTabName() === 'questions'"
             class="fas fa-book-open">&#xE254;
          </i>
          <i *ngIf="!getTotalWarningsCount() && (getActiveTabName() === 'topic_preview' || getActiveTabName() === 'subtopic_preview')"
             class="fas fa-play">&#xE254;
          </i>
          <span>{{ activeTab }}</span>
          <span [hidden]="!totalWarningsCount">
            ({{ totalWarningsCount }} <i class="fa fa-exclamation-triangle oppia-error-icon"></i>)
          </span>
        </div>
        <div class="oppia-topic-nav-dropdown-icon e2e-test-mobile-navbar-dropdown"
             (click)="toggleNavigationOptions()">
          <i class="fa fa-caret-down"></i>
        </div>
      </div>
    </div>
    <div class="oppia-topic-nav-dropdown-container oppia-save-options-dropdown">
      <div class="oppia-topic-nav-topic-nav-dropdown-options" *ngIf="showTopicEditOptions">
        <div class="oppia-topic-nav-dropdown-option" (click)="discardChanges()">
          <i class="fas fa-pen"></i>
          <span>Discard Changes</span>
        </div>
        <div class="oppia-topic-nav-dropdown-option">
          <div *ngIf="!topicRights.isPublished()"
               class="e2e-test-mobile-publish-topic-button"
               (click)="publishTopic()"
               [attr.disabled]="isTopicSaveable() || getWarningsCount() > 0 || prepublishValidationIssues.length > 0">
            <i class="fas fa-pen"></i>
            <span>Publish Topic</span>
          </div>
          <div (click)="unpublishTopic()"
               *ngIf="topicRights.isPublished() && topicRights.canPublishTopic()"
               class="e2e-test-mobile-unpublish-topic-button"
               [attr.disabled]="isTopicSaveable()">
            <i class="fas fa-pen"></i>
            <span>Unpublish Topic</span>
          </div>
        </div>
      </div>
      <div class="oppia-topic-nav-dropdown-content oppia-right-container">
        <div class="oppia-topic-nav-dropdown-text e2e-test-mobile-save-topic-button"
             (click)="saveChanges()">
          <span *ngIf="isSaveInProgress()">
            <span>Saving</span>
          </span>
          <span *ngIf="!isSaveInProgress()">
            Save Changes
          </span>
          <span [hidden]="!(changeListLength > 0)">
            ({{ changeListLength }})
          </span>
        </div>
        <div class="oppia-topic-nav-dropdown-icon e2e-test-mobile-save-topic-dropdown"
             (click)="toggleTopicEditOptions()">
          <i class="fa fa-caret-down"></i>
        </div>
      </div>
    </div>
  </div>
</div>
