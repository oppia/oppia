<div class="oppia-learner-hint-and-solution-modal-title">
  <span [innerHTML]="'I18N_HINT_TITLE' | translate"></span> {{activeHintIndex + 1}}
</div>

<div class="modal-body">
  <span>
    <oppia-rte-output-display class="oppia-learner-hint-and-solution-modal-body"
                              [rteString]="hint.html">
    </oppia-rte-output-display>
  </span>
</div>

<div class="oppia-learner-solution-container" [ngStyle]="activeHintIndex === 0 ? {'justify-content': 'flex-end'} : {}">
  <button mat-button class="hint-modal-control-btn" *ngIf="activeHintIndex > 0"
          (click)="updateHintModal(this.activeHintIndex - 1)"> Previous
  </button>

	<p *ngIf="numHintsReleased > 1">
		Hints ({{activeHintIndex + 1}}/{{numHintsReleased}})
	</p>

	<button mat-button class="hint-modal-control-btn" *ngIf="activeHintIndex < numHintsReleased - 1"
          (click)="updateHintModal(this.activeHintIndex + 1)"> Next
  </button>

  <button mat-button class="hint-display-modal-got-it-button e2e-test-learner-got-it-button" *ngIf="activeHintIndex === numHintsReleased - 1"
          (click)="closeModal()">
    <span [innerHTML]="'I18N_GOT_IT' | translate"></span>
  </button>
</div>
<span class="clearfix"></span>
