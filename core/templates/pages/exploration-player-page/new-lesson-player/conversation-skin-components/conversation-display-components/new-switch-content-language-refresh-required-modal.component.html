<button class="switch-language-modal-cancel-btn" mat-icon-button (click)="cancel()" aria-label="Close the modal">
  <mat-icon>close</mat-icon>
</button>
<div class="modal-header">
  <h3>
    Switch languages?
  </h3>
</div>

<div class="modal-body">
  <p>{{ modalText }}
  </p>
  <br>
  <p>
    Would you like to proceed?
  </p>
</div>

<div class="modal-footer">
  <button class="btn btn-success" (click)="confirm()">Restart Lesson</button>
</div>
