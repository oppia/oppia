<div class="oppia-learner-hint-and-solution-modal-title">
  <span [innerHTML]="'I18N_SOLUTION_TITLE' | translate"></span>
</div>

<div class="modal-body">
  <label>{{ shortAnswerHtml.prefix }} solution is: &nbsp; </label>
  <span>
    <oppia-interaction-display classStr="oppia-learner-hint-and-solution-modal-body"
                               [htmlData]="shortAnswerHtml.answer">
    </oppia-interaction-display>
  </span>
  <br>
  <br>
  <label><span [innerHTML]="'I18N_SOLUTION_EXPLANATION_TITLE' | translate"></span></label>
  <span>
    <oppia-rte-output-display class="oppia-learner-hint-and-solution-modal-body"
                              [rteString]="solutionExplanationHtml">
    </oppia-rte-output-display>
  </span>
</div>

<div class="oppia-learner-solution-container">
  <button mat-button class="oppia-learner-got-it-button e2e-test-learner-got-it-button"
          (click)="closeModal()">
    <span [innerHTML]="'I18N_GOT_IT' | translate" style="text-transform: uppercase;"></span>
  </button>
</div>
<span class="clearfix"></span>

<style>
  .oppia-learner-hint-and-solution-modal-title {
    color: #00786d;
    font-family: 'Capriola', 'Roboto', 'Arial', sans-serif;
    font-size: 1.75em;
    font-weight: bold;
    padding-top: 20px;
    text-align: center;
  }

  .oppia-learner-hint-and-solution-modal-body {
    word-wrap: break-word;
  }

  .modal-body {
    padding: 0 20px;
  }

  .oppia-learner-solution-container {
    display: flex;
    justify-content: flex-end;
    padding: 16px 20px;
  }

  .mat-button.oppia-learner-got-it-button {
    background-color: #00786d;
    color: white;
    height: 35px;
    padding: 6px 12px;
    border-radius: 4px !important;
    border: none !important;
    font-weight: 500;
    text-transform: uppercase;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    min-width: 0;
    outline: none !important;
    box-shadow: none !important;
  }

  .mat-button.oppia-learner-got-it-button:hover {
    background-color: #00655a;
  }

  .mat-button.oppia-learner-got-it-button:focus {
    outline: none !important;
    box-shadow: none !important;
  }

  .clearfix {
    clear: both;
  }
</style>
