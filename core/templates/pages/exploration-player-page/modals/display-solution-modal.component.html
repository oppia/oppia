<div class="oppia-learner-hint-and-solution-modal-title">
  <span [innerHTML]="'I18N_SOLUTION_TITLE' | translate"></span>
</div>

<div class="modal-body">
  <label>{{ shortAnswerHtml.prefix }} solution is: &nbsp; </label>
  <span>
    <oppia-interaction-display classStr="oppia-learner-hint-and-solution-modal-body"
                               [htmlData]="shortAnswerHtml.answer">
    </oppia-interaction-display>
  </span>
  <br><br>
  <label>
    <span [innerHTML]="'I18N_SOLUTION_EXPLANATION_TITLE' | translate"></span>
  </label>
  <span>
    <oppia-rte-output-display class="oppia-learner-hint-and-solution-modal-body"
                              [rteString]="solutionExplanationHtml">
    </oppia-rte-output-display>
  </span>
</div>

<!-- ✅ Wrap button in a flex container -->
<div class="got-it-button-container">
  <button mat-button class="oppia-learner-got-it-button e2e-test-learner-got-it-button"
          (click)="closeModal()">
    <span [innerHTML]="'I18N_GOT_IT' | translate"></span>
  </button>
</div>

<span class="clearfix"></span>

<style>
  .oppia-learner-hint-and-solution-modal-title {
    color: #00786d;
    font-family: 'Capriola', Roboto, arial, sans-serif;
    font-size: 1.75em;
    font-weight: bold;
    padding-top: 20px;
    text-align: center;
  }

  .oppia-learner-hint-and-solution-modal-body {
    word-wrap: break-word;
  }

  /* ✅ Flex container for aligning the button */
  .got-it-button-container {
    display: flex;
    justify-content: flex-end;
    padding: 16px 20px;
  }

  .oppia-learner-got-it-button {
    background-color: #009688;
    color: white;
    padding: 8px 20px;
    border-radius: 4px;
    border: none;
    font-weight: 500;
    text-transform: none;
    cursor: pointer;
  }

  .oppia-learner-got-it-button:hover {
    background-color: #038a7d;
  }
</style>
