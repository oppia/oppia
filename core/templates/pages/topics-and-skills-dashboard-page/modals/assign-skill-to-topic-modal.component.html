<div class="modal-header">
  <h3>Select topic(s) to which the skill is to be assigned</h3>
</div>

<div class="modal-body">
  <oppia-select-topics [topicSummaries]="topicSummaries"
                       [(selectedTopicIds)]="selectedTopicIds">
  </oppia-select-topics>
  <em *ngIf="!topicSummaries.length">The skill is already assigned to all available topics.</em>
</div>

<div class="modal-footer">
  <button class="btn btn-secondary" (click)="cancel(selectedTopicIds)">Cancel</button>
  <button class="btn btn-success e2e-test-confirm-move-button" [disabled]="selectedTopicIds.length === 0" (click)="confirm(selectedTopicIds)">Save</button>
</div>
