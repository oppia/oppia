<div class="card e2e-test-featured-translation-languages-editor">
  <div class="card-header">
    <button type="button"
            class="btn btn-secondary e2e-test-toggle-featured-languages-editor"
            (click)="toggleEditor()">
      {{ isEditorOpen ? 'Hide' : 'Manage' }} featured translation languages
    </button>
  </div>
  <div class="card-body" *ngIf="isEditorOpen">
    <p>
      These languages appear under "Most needed" on the Contributor Dashboard
      translation tab.
    </p>

    <div *ngIf="loadingMessage" class="oppia-align-center">
      <span>{{ loadingMessage }}</span>
      <loading-dots></loading-dots>
    </div>

    <div *ngIf="!loadingMessage">
      <table class="table">
        <thead>
          <tr>
            <th>Language</th>
            <th>Explanation</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="featuredLanguages.length === 0">
            <td colspan="3">No featured languages configured.</td>
          </tr>
          <tr *ngFor="let language of featuredLanguages; index as i">
            <td class="text-nowrap">{{ language.languageCode }}</td>
            <!-- The text-break class lets long explanations (including ones
                 without spaces) wrap inside the cell, so the table never grows
                 wider than the card and pushes the Remove buttons off-screen. -->
            <td class="w-100 text-break">{{ language.explanation }}</td>
            <td class="text-nowrap">
              <button type="button"
                      class="btn btn-secondary e2e-test-remove-featured-language"
                      (click)="removeFeaturedLanguage(i)">
                Remove
              </button>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="border rounded p-3 mt-4 mb-4 e2e-test-add-featured-language-row">
        <p class="fw-bold mb-3">Add a featured language</p>
        <div class="mb-3">
          <label for="featured-language-select" class="form-label">Language</label>
          <select id="featured-language-select"
                  class="form-select"
                  [(ngModel)]="newLanguageCode">
            <option value="">Select language</option>
            <option *ngFor="let option of availableLanguageOptions"
                    [value]="option.id">
              {{ option.description }}
            </option>
          </select>
        </div>

        <div class="mb-3">
          <label for="featured-language-explanation" class="form-label">Explanation</label>
          <textarea id="featured-language-explanation"
                    class="form-control"
                    rows="4"
                    [(ngModel)]="newExplanation"
                    placeholder="Why should contributors prioritize this language? Contributors see this as a tooltip in the language selector.">
          </textarea>
        </div>

        <button type="button"
                class="btn btn-secondary e2e-test-add-featured-language"
                [disabled]="!newLanguageCode || !newExplanation.trim()"
                (click)="addFeaturedLanguage()">
          Add language
        </button>
      </div>

      <button type="button"
              class="btn btn-success e2e-test-save-featured-languages"
              [disabled]="saveInProgress"
              (click)="saveFeaturedTranslationLanguages()">
        Save
      </button>
    </div>
  </div>
</div>
