<div class="modal-header">
  <h3>
    <span><p>{{confirmationTitle | translate}}</p></span>
  </h3>
</div>

<div class="modal-body">
  <p>{{confirmationMessage | translate}}</p>
</div>

<div class="modal-footer">
  <button class="btn btn-primary" (click)="cancel()" [innerHTML]="'I18N_MODAL_CANCEL_BUTTON' | translate"></button>
  <button class="btn btn-danger" (click)="confirm()" [innerHTML]="'I18N_MODAL_REMOVE_BUTTON' | translate"></button>
</div>
