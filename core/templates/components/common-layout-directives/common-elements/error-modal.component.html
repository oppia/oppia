<div class="modal-body oppia-error-modal-body">
  <h3 class="oppia-error-modal-title">{{ 'I18N_ERROR_MODAL_TITLE' | translate }}</h3>

  <div *ngIf="!reportSentSuccessfully">
    <p class="oppia-error-modal-message">
      {{ 'I18N_ERROR_MODAL_MESSAGE' | translate }}
    </p>

    <div class="oppia-error-details-container">
      <button class="oppia-error-details-toggle-link e2e-test-error-details-toggle-link" (click)="toggleDetails()" type="button">
        <i class="fa oppia-error-details-arrow" [ngClass]="showDetails ? 'fa-caret-down' : 'fa-caret-right'"></i>
        {{ showDetails ? ('I18N_ERROR_MODAL_HIDE_DETAILS' | translate) : ('I18N_ERROR_MODAL_SHOW_DETAILS' | translate) }}
      </button>
      <div class="oppia-error-details-content" *ngIf="showDetails">
        <pre class="e2e-test-error-details-content">{{ errorMessage }}</pre>
      </div>
    </div>

    <div class="form-group oppia-error-description-group">
      <label for="errorDescription" class="oppia-error-description-label">{{ 'I18N_ERROR_MODAL_DESCRIPTION_LABEL' | translate }}</label>
      <textarea id="errorDescription"
                class="form-control oppia-error-description-textarea"
                rows="4"
                [(ngModel)]="description">
      </textarea>
      <div *ngIf="submitFailed" class="oppia-form-error oppia-form-error-text mt-2">
        {{ 'I18N_ERROR_MODAL_SUBMIT_FAILED' | translate }}
      </div>
    </div>
  </div>

  <div *ngIf="reportSentSuccessfully" class="oppia-error-success-message">
    <p>{{ 'I18N_ERROR_MODAL_SUCCESS_MESSAGE' | translate }}</p>
  </div>
</div>

<div class="modal-footer oppia-error-modal-footer">
  <button class="btn btn-secondary e2e-test-close-button" (click)="close()">
    {{ 'I18N_ERROR_MODAL_CLOSE_BUTTON' | translate }}
  </button>
  <oppia-primary-button *ngIf="!reportSentSuccessfully"
                        [buttonText]="isSubmitting ? ('I18N_ERROR_MODAL_SENDING_BUTTON' | translate) : ('I18N_ERROR_MODAL_SEND_REPORT_BUTTON' | translate)"
                        (onClickPrimaryButton)="sendReport()"
                        [disabled]="isSubmitting">
  </oppia-primary-button>
</div>
