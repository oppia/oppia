<div class="assessment-modal-overlay">
  <div class="assessment-modal-card">

    <div class="assessment-modal-header">
      <div class="assessment-modal-header-content">
        <svg class="assessment-modal-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2 L23 21 H1 Z" fill="#f5a623"/>
          <rect x="11" y="9" width="2" height="6" rx="1" fill="#ffffff"/>
          <circle cx="12" cy="18" r="1.2" fill="#ffffff"/>
        </svg>
        <h2 class="assessment-modal-title">Some questions are unanswered</h2>
      </div>

      <button type="button" class="assessment-modal-close-button" aria-label="Close" (click)="onClose()">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 4L16 16M16 4L4 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <p class="assessment-modal-message">
      You have {{ unansweredQuestionCount }} unanswered questions.
      Unanswered questions will be marked incorrect.
    </p>

    <p class="assessment-modal-message">
      Press
      <button
        type="button"
        class="assessment-modal-inline-key"
        aria-label="Go back to assessment"
        (click)="onGoBackToAssessment()">
        <svg width="10" height="10" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 4L16 16M16 4L4 16" stroke="#334e68" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </button>
      to go back to the assessment or submit anyway.
    </p>

    <div class="assessment-modal-actions">
      <button
        type="button"
        class="btn btn-primary assessment-modal-action-button"
        (click)="onSubmitAnyway()">
        Submit Assessment
      </button>
    </div>

  </div>
</div>
