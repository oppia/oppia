<div class="assessment-interrupt-card">
  <h2 class="assessment-interrupt-title">{{ 'I18N_ASSESSMENT_INTERRUPT_TITLE' | translate }}</h2>

  <p class="assessment-interrupt-message">
    {{ 'I18N_ASSESSMENT_INTERRUPT_SESSION_ENDED' | translate }}
  </p>

  <p class="assessment-interrupt-message">
    {{ 'I18N_ASSESSMENT_INTERRUPT_RETRY_MESSAGE' | translate }}
  </p>

  <div class="assessment-interrupt-note">
    <span class="assessment-interrupt-note-icon">i</span>
    <p class="assessment-interrupt-note-text">
      {{ 'I18N_ASSESSMENT_INTERRUPT_NOTE_TEXT' | translate }}
    </p>
  </div>

  <div class="assessment-interrupt-actions">
    <button type="button" class="btn btn-secondary assessment-interrupt-action-button" (click)="onRetryAssessment()">
      {{ 'I18N_ASSESSMENT_INTERRUPT_RETRY_BUTTON' | translate }}
    </button>
    <button type="button" class="btn btn-primary assessment-interrupt-action-button" (click)="onResumeAssessment()">
      {{ 'I18N_ASSESSMENT_INTERRUPT_RESUME_BUTTON' | translate }}
    </button>
  </div>
</div>
