<div class="assessment-interrupt-card">
  <h2 class="assessment-interrupt-title">Assessment Interrupted</h2>

  <p class="assessment-interrupt-message">
    Your assessment session ended before it was submitted.
  </p>

  <p class="assessment-interrupt-message">
    Don't worry. You can retry or resume this assessment whenever you're ready.
  </p>

  <div class="assessment-interrupt-note">
    <span class="assessment-interrupt-note-icon">i</span>
    <p class="assessment-interrupt-note-text">
      Because this assessment was not submitted, your answers were not saved.
      This attempt does not count toward earning a certificate.
    </p>
  </div>

  <div class="assessment-interrupt-actions">
    <button type="button" class="btn btn-secondary assessment-interrupt-action-button">
      Retry assessment
    </button>
    <button type="button" class="btn btn-primary assessment-interrupt-action-button">
      Resume
    </button>
  </div>
</div>
