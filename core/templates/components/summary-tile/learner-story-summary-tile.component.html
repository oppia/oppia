<ng-container>
  <div class="learner-story-summary-tile" *ngIf="!redesignFeatureFlag">
    <div class="next-incomplete-chapter" *ngIf="isDisplayAreaHome()">
      {{nextIncompleteNodeTitle}}
    </div>
    <mat-card class="oppia-story-dashboard-card" (mouseenter)="cardIsHovered=true" (mouseleave)="cardIsHovered=false">
      <div class="flex space-between">
        <div class="classroom-name-container">
          <p class="classroom-name">{{ storySummary.getClassroomName() }}</p>
        </div>
        <div class="classroom-new-chapter" *ngIf="isNewChapterLabelVisible() && isSerialChapterFeatureLearnerFlagEnabled()">
          <p class="classroom-status">New</p>
        </div>
      </div>
      <a class="oppia-story-link"
         [attr.href]="isSerialChapterFeatureLearnerFlagEnabled() ?  statusIsPublished ? getStoryLink() : null : getStoryLink()"
         [title]="isSerialChapterFeatureLearnerFlagEnabled() && !statusIsPublished ? ('I18N_LEARNER_STORY_TILE_COMING_SOON_TOOLTIP' | translate) : ''"
         (click)="isSerialChapterFeatureLearnerFlagEnabled() ? onStoryClick($event) : null"
         (contextmenu)="isSerialChapterFeatureLearnerFlagEnabled() ? onStoryClick($event) : null"
         [attr.tabindex]="!isSerialChapterFeatureLearnerFlagEnabled() || statusIsPublished ? 0 : -1"
         target="!isSerialChapterFeatureLearnerFlagEnabled ? {{ openInNewWindow ? '_blank' : '_self' }} : {{ statusIsPublished && openInNewWindow ? '_blank' : '_self' }}">
        <div class="story-card">
          <div class="oppia-title-section" [ngStyle]="{'background-color': thumbnailBgColor}">
              <!-- We add an empty alt text so that the screen reader does not read the thumbnail image filename and ignores it as the thumbnail does not convey any significant information. -->
            <img class="oppia-thumbnail-image" alt="" [src]="thumbnailUrl" [attr.style]="isCardHovered()">
            <div class="oppia-story-completion">
              <img [src]="starImageUrl" alt="star image" class="oppia-svg-star-image" *ngIf="storyCompleted">
              <p class="oppia-percent-story-completed" [ngClass]="{'oppia-story-completed-percent': storyCompleted}">
                {{storyProgress}}% Complete
              </p>
            </div>
          </div>
          <div class="oppia-summary-section">
            <span class="oppia-story-title e2e-test-story-name-in-learner-story-summary-tile">
              {{storyTitle}}
            </span>
            <span class="oppia-topic-title e2e-test-topic-name-in-learner-story-summary-tile">
              {{topicName}}
            </span>
          </div>
        </div>
        <div class="continue-button" *ngIf="isDisplayAreaHome()">
          <p *ngIf="!isSerialChapterFeatureLearnerFlagEnabled()" class="continue-button-text">
            Continue
          </p>
          <p *ngIf="isSerialChapterFeatureLearnerFlagEnabled()" class="continue-button-text">
            {{ statusIsPublished ? ('I18N_LEARNER_STORY_TILE_CONTINUE' | translate) : ('I18N_LEARNER_STORY_TILE_COMING_SOON' | translate) }}
          </p>
        </div>
      </a>
    </mat-card>
  </div>
  <ng-container *ngIf="redesignFeatureFlag">
    <lesson-card [story]="storySummary" [topic]="topicName">
    </lesson-card>
  </ng-container>
</ng-container>
