<ng-container>
  <a class="e2e-test-learner-topic-summary-tile d-flex flex-column flex-shrink-0 oppia-class-card text-decoration-none" [href]="getTopicLink()" target="{{ openInNewWindow ? '_blank' : '_self' }}">
    <div class="oppia-class-card-img rounded-top" [ngStyle]="{'background-color': thumbnailBgColor}">
      <img alt="" class="h-100 oppia-thumbnail-image" [src]="thumbnailUrl">
    </div>
    <div class="oppia-class-card-info">
      <p class="mb-2 oppia-class-card-title e2e-test-learner-topic-summary-tile-title">
        {{ topicTitle }}
      </p>
      <p class="oppia-class-card-text">
        {{ totalPublishedNodeCount }}
        <span [innerHTML]="'I18N_COUNT_OF_LESSONS' | translate: {
          lessonCountValue: totalPublishedNodeCount,
          messageFormat: true
        }"></span>
      </p>
    </div>
  </a>
</ng-container>
