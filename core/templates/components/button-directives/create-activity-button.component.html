<div class="btn-group"
     [ngClass]="checkTabletView() ? 'oppia-button-display' : 'float-end'">
  <!-- User must complete the registration process. -->
  <oppia-primary-button
          [customClasses]="'oppia-creator-dashboard-intro-button oppia-transition-200 e2e-test-create-activity e2e-test-create-new-exploration-button oppia-autofocus'"
          (onClickPrimaryButton)="onRedirectToLogin('/creator-dashboard?mode=create')"
          [buttonText]="'+ ' + ('I18N_CREATE_EXPLORATION' | translate)"
          *ngIf="userIsLoggedIn !== true">
          <!-- "Show the create button unless we are certain the user is logged in.This avoids a UI dead state while auth status is still resolving
                (  e.g. during initial load or in E2E tests)-->
  </oppia-primary-button>
  <oppia-primary-button [customClasses]="'oppia-creator-dashboard-intro-button oppia-transition-200 e2e-test-create-activity e2e-test-create-new-exploration-button oppia-autofocus'"
                        (onClickPrimaryButton)="initCreationProcess()"
                        *ngIf="userIsLoggedIn !== true"
                        [buttonText]="'+ ' + ('I18N_CREATE_EXPLORATION' | translate)">
  </oppia-primary-button>
  <button class="btn nav-link oppia-navbar-button oppia-navbar-hide-on-small-width oppia-transition-200"
          (click)="showUploadExplorationModal()"
          [disabled]="creationInProgress"
          *ngIf="allowYamlFileUpload && userIsLoggedIn">
    <span class="oppia-navbar-tab-content"
          [innerHTML]="'I18N_CREATE_EXPLORATION_UPLOAD' | translate">
    </span>
  </button>
</div>

<style>
  .oppia-creator-dashboard-intro-button {
    background-color: #00645c;
    border-radius: 6px;
    color: #fff;
    font-family: "Roboto", Arial, sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.7px;
    margin-top: 10px;
    padding: 10px 12px;
    text-transform: uppercase;
    width: 200px;
  }

  .oppia-button-display {
    display: block;
  }

  .btn-group button:focus {
   outline: 2px solid darkblue;
  }
</style>
