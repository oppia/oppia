<div *ngIf="!configError">
  <div class="d-flex flex-column-reverse">
    <span class="oppia-cke-offline-warning" *ngIf="!connectedToInternet">* Tools with dark background can not be used when offline.</span>
  </div>
  
  <!-- Paste error message display with selective paste option -->
  <div *ngIf="getPasteError()" class="oppia-rte-paste-error-box">
    <div>
      <span>{{ getPasteError() }}</span>
      
      <!-- Show confirmation buttons only when selective paste is available -->
      <div *ngIf="shouldShowPasteConfirmation()" class="oppia-rte-paste-confirmation-buttons">
        <button 
          type="button" 
          class="oppia-rte-paste-confirm-btn oppia-rte-paste-yes-btn" 
          (click)="confirmSelectivePaste()" 
          aria-label="Paste valid content">
          Yes, paste valid content
        </button>
        <button 
          type="button" 
          class="oppia-rte-paste-confirm-btn oppia-rte-paste-no-btn" 
          (click)="rejectSelectivePaste()" 
          aria-label="Cancel paste">
          No, cancel
        </button>
      </div>
    </div>
    
    <!-- Show dismiss button only when no confirmation is needed -->
    <button 
      *ngIf="!shouldShowPasteConfirmation()"
      type="button" 
      class="oppia-rte-paste-confirm-btn oppia-rte-paste-no-btn" 
      (click)="dismissPasteError()" 
      aria-label="Dismiss error">
      Dismiss
    </button>
  </div>
  
  <div contenteditable="true" class="oppia-rte-resizer oppia-rte e2e-test-rte" #oppiaRTE></div>
</div>

<!-- Error message box shown when configuration is missing -->
<div *ngIf="configError" class="oppia-rte-error-box">
  Rich-text editor error: {{ configError }}
</div>

<style>
  /* Enhanced styles matching your existing design */

.oppia-rte {
  max-height: 500px;
  overflow-y: auto;
}

.oppia-cke-offline-warning {
  background: #eee;
  border: 1px solid #ddd;
  border-radius: 4px;
  border-top: none;
  color: #5a5a5a;
  font-size: small;
  padding: 0 3px;
}

.oppia-rte-error-box {
  background-color: #ff8d70; /* Light orange */
  border: 1px solid #ff3c00; /* Orange border */
  border-radius: 4px;
  padding: 12px;
  margin: 8px 0;
  color: #7A4F01; /* Dark orange/brown text */
}

.oppia-rte-paste-error-box {
  background-color: #ffe6e6; /* Light red background */
  border: 1px solid #ff9999; /* Light red border */
  border-radius: 4px;
  padding: 8px 12px;
  margin: 4px 0 8px 0;
  color: #cc0000; /* Dark red text */
  font-size: 14px;
  animation: fadeIn 0.3s ease-in;
}

/* New styles for confirmation buttons */
.oppia-rte-paste-confirmation-buttons {
  margin-top: 8px;
  display: flex;
  gap: 8px;
  align-items: center;
}

.oppia-rte-paste-confirm-btn {
  padding: 6px 12px;
  border: none;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  min-width: 80px;
}

.oppia-rte-paste-yes-btn {
  background-color: #28a745;
  color: white;
}

.oppia-rte-paste-yes-btn:hover {
  background-color: #218838;
}

.oppia-rte-paste-yes-btn:active {
  background-color: #1e7e34;
}

.oppia-rte-paste-no-btn {
  background-color: #ffffff;
  color: rgb(0, 0, 0);
}

.oppia-rte-paste-no-btn:hover {
  background-color: #5a6268;
}

.oppia-rte-paste-no-btn:active {
  background-color: #545b62;
}

/* Focus styles for confirmation buttons */
.oppia-rte-paste-confirm-btn:focus {
  outline: 2px solid #007bff;
  outline-offset: 2px;
}

/* Existing fade-in animation */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Responsive design */
@media screen and (max-width: 700px) {
  .oppia-rte {
    font-size: 16px;
  }
  .oppia-rte-paste-error-box {
    font-size: 13px;
    padding: 6px 10px;
  }
  .oppia-rte-paste-confirmation-buttons {
    flex-direction: column;
    align-items: stretch;
    gap: 4px;
  }
  .oppia-rte-paste-confirm-btn {
    width: 100%;
    font-size: 11px;
  }
}
</style>
