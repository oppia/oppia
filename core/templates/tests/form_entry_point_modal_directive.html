<ng-form name="schemaForm">
  <schema-based-editor ng-model="localValue" ng-model-change="$applyAsync()" [schema]="definition" [disabled]="isDisabled()">
  </schema-based-editor>
</ng-form>

<div *ngIf="!isDisabled()">
  <button (click)="submitValue(localValue)" class="btn btn-success" [disabled]="schemaForm.invalid">
    Submit
  </button>
  <button (click)="cancelEdit()" class="btn btn-secondary">
    Cancel
  </button>
  
</div>
