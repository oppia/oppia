# This workflow is used to regenerate Playwright acceptance test screenshot
# baselines (prod-desktop-screenshots / prod-mobile-screenshots) for a single
# suite. It is manually triggered, runs the suite with --update_snapshots,
# and uploads the entire prod-{viewport}-screenshots folder as an artifact
# for human review.

name: Update acceptance test snapshots

permissions: read-all

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Name of acceptance test suite to update (e.g. "logged-in-learner/changes-site-language-to-rtl").'
        required: true
        type: string
      viewport_type:
        description: 'Viewport to regenerate snapshots for.'
        required: true
        type: choice
        options:
          - desktop
          - mobile

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  setup_merge_sha:
    name: Capture develop SHA
    runs-on: ubuntu-22.04
    outputs:
      develop_sha: ${{ steps.get_sha.outputs.sha }}
    steps:
      - name: Get latest develop SHA
        id: get_sha
        run: |
          SHA=$(git ls-remote https://github.com/oppia/oppia.git refs/heads/develop | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  update_snapshots:
    name: Update snapshots (${{ inputs.viewport_type }}) for ${{ inputs.test_suite }}
    needs: setup_merge_sha
    runs-on: ubuntu-22.04
    steps:
      - name: Sanitize test_suite input
        env:
          TEST_SUITE: ${{ inputs.test_suite }}
        run: |
          if [[ "$TEST_SUITE" =~ [^a-zA-Z0-9/_-] ]]; then
            echo "test_suite contains invalid characters (only letters, digits, underscore, slash, and hyphen allowed)."
            exit 1
          fi

      - name: Checkout repository so that local actions can be used
        uses: actions/checkout@v4

      - name: Merge develop and set up dependencies
        uses: ./.github/actions/merge-develop-and-set-up-dependencies
        with:
          merge_sha: ${{ needs.setup_merge_sha.outputs.develop_sha }}

      - name: Generate build files
        uses: ./.github/actions/generate-build-files

      - name: Generate modified suite name for artifacts
        id: generate_suite_name_for_artifacts
        env:
          TEST_SUITE: ${{ inputs.test_suite }}
        run: |
          echo "MODIFIED_SUITE_NAME=${TEST_SUITE//\//_}" >> "$GITHUB_OUTPUT"
          # The screenshots folder lives at the spec-file-directory level
          # (e.g. specs/logged-in-learner/prod-desktop-screenshots/), not
          # nested under the full suite name (e.g.
          # logged-in-learner/add-and-remove-exploration). Strip everything
          # after the first "/" to get just the directory component.
          echo "SPEC_DIR=${TEST_SUITE%%/*}" >> "$GITHUB_OUTPUT"

      - name: Run acceptance test with snapshot update
        id: run-update-snapshots
        shell: bash
        # We use xvfb-run to create a virtual screen to run tests without headless mode.
        # Numbers in 1920x1080x24 represent screen width, height and color depth respectively.
        # --prod_env is required here so that the regenerated snapshots land
        # in prod-{viewport}-screenshots, matching what full-stack-tests.yml
        # actually checks on every PR. Running without --prod_env would
        # update dev-{viewport}-screenshots instead, which CI never reads.
        run: >
          set -o pipefail;
          VIDEO_RECORDING_IS_ENABLED=0
          xvfb-run -a --server-args="-screen 0, 1920x1080x24"
          python -m scripts.run_acceptance_tests
          --skip_build
          --suite=${{ inputs.test_suite }}
          ${{ inputs.viewport_type == 'mobile' && '--mobile' || '' }}
          --prod_env
          --update_snapshots
          --server_log_level=info
          | tee update_snapshots_${{ steps.generate_suite_name_for_artifacts.outputs.MODIFIED_SUITE_NAME }}.log

      - name: Upload run log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: update-snapshots-log_${{ steps.generate_suite_name_for_artifacts.outputs.MODIFIED_SUITE_NAME }}_${{ inputs.viewport_type }}
          path: update_snapshots_${{ steps.generate_suite_name_for_artifacts.outputs.MODIFIED_SUITE_NAME }}.log
          if-no-files-found: warn

      - name: Upload all snapshots in the prod-${{ inputs.viewport_type }}-screenshots folder for review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: updated-snapshots_${{ steps.generate_suite_name_for_artifacts.outputs.MODIFIED_SUITE_NAME }}_${{ inputs.viewport_type }}
          path: /home/runner/work/oppia/oppia/core/tests/playwright-acceptance-tests/specs/${{ steps.generate_suite_name_for_artifacts.outputs.SPEC_DIR }}/prod-${{ inputs.viewport_type }}-screenshots/
          if-no-files-found: warn
