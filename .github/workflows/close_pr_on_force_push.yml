name: Close PR on force-push or rebase
on:
  pull_request:
    types:
        - opened
        - synchronize
        - reopened
permissions: read-all
jobs:
  detect_force_push:
    runs-on: ubuntu-24.04
    permissions:
        issues: write
        pull-requests: write
    steps:
      - name: Close PR if branch was force-pushed or rebased
        uses: actions/github-script@v6
        with:
          script: |
            const pr = context.payload.pull_request;

            // head_ref_force_pushed is the same timeline event GitHub's own
            // UI uses to show the "force-pushed" badge on a PR, so this
            // reflects any rewrite the PR's branch has undergone since the
            // PR was created, regardless of which of opened/synchronize/
            // reopened this run was triggered by.
            const { data: timeline } = await github.rest.issues.listEventsForTimeline({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const wasForcePushed = timeline.some(
              (e) => e.event === 'head_ref_force_pushed'
            );

            if (wasForcePushed) {
              const comment = `Hi @${pr.user.login}, this PR's branch appears to have been force-pushed or rebased, which rewrites commit history. Per our [contribution guidelines](https://github.com/oppia/oppia/wiki/Contributing-code-to-Oppia#instructions-for-making-a-code-change), force-pushing to a PR branch is not allowed, so this PR is being closed. Please open a new PR from a fresh branch instead of force-pushing. Thanks!`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: comment,
              });

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed',
              });
            }
