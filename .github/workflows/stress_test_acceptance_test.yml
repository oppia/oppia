# This workflow is used to run the acceptance tests multiple times.
# It's not used in the CI, but is used to test the falkiness of an acceptance test.

name: Stress Test (Acceptance Test)

permissions: read-all
on:
  workflow_dispatch:
    inputs:
      num_runs:
        description: 'Number of times to run the acceptance tests (Max: 128).'
        required: true
        default: '10'
        type: string
      test_suite:
        description: 'Acceptance test to run. (e.g. "interested-donor/make-a-donation")'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      NUM_RUNS: ${{ inputs.num_runs }}
    steps:
      - name: Sanitize and generate matrix
        id: set-matrix
        shell: bash
        run: |
          # Ensure num_runs is numeric and within safe bounds
          if ! [[ "$NUM_RUNS" =~ ^[0-9]+$ ]]; then
            echo "Error: num_runs must be an integer" >&2
            exit 1
          fi

          if [ "$NUM_RUNS" -gt 128 ]; then
            echo "Error: num_runs exceeds 128" >&2
            exit 1
          fi          

          MATRIX=$(seq 1 "$NUM_RUNS" | jq -R . | jq -s -c .)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    name: Build the app, and store build files as an artifact
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository so that local actions can be used
        uses: actions/checkout@v4
      - name: Merge develop and set up dependencies
        uses: ./.github/actions/merge-develop-and-set-up-dependencies
      - name: Generate build files
        uses: ./.github/actions/generate-build-files

  acceptance_test_with_python_installation:
    needs: [build, generate-matrix]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
        mobile: [false, true]
    name: (${{ matrix.mobile && 'M' || 'D' }}) ${{ inputs.test_suite }}
    env:
      TEST_SUITE: ${{ inputs.test_suite }}
    steps:
      - name: Sanitize test_suite input
        run: |
          if [[ "$TEST_SUITE" =~ [^a-zA-Z/-] ]]; then
          echo "TEST_SUITE contains invalid characters (only alphabets, slashes, and dashes allowed)."
          exit 1
          else
          echo "TEST_SUITE is valid."
          fi
      - name: Checkout repository so that local actions can be used
        uses: actions/checkout@v4
      - name: Merge develop and set up dependencies
        uses: ./.github/actions/merge-develop-and-set-up-dependencies
      - name: Generate build files
        uses: ./.github/actions/generate-build-files
      - name: Generate modified suite name for artifacts
        id: generate_suite_name_for_artifacts
        # Replace slashes in the filename with underscores.
        run: |
          SUITE_NAME=${{ inputs.test_suite }}-${{ matrix.run }}-${{ matrix.mobile && 'mobile' || 'desktop' }}
          echo "MODIFIED_SUITE_NAME=${SUITE_NAME//\//_}" >> $GITHUB_OUTPUT
      - name: Run ${{ matrix.mobile && 'Mobile' || 'Desktop' }} Acceptance Test
        uses: ./.github/actions/run-acceptance-tests
        with:
          test-suite: ${{ inputs.test_suite }}
          mobile: ${{ matrix.mobile }}
          screen-recording: true
          modified-suite-name: ${{ steps.generate_suite_name_for_artifacts.outputs.MODIFIED_SUITE_NAME }}
