name: Pull Request Label Management

on:
  pull_request_target:
    types: [labeled, unlabeled]

env:
  PAT_TOKEN: ${{ secrets.TEAM_READ_PAT }}  # PAT with read:org scopes

permissions: {}

jobs:
  process-labels:
    name: Process Label Actions
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write

    steps:
      - name: Handle label changes
        uses: actions/github-script@v7
        with:
          github-token: ${{ env.PAT_TOKEN }}
          script: |
            const { context, github } = require('@actions/github');
            const octokit = github.rest;

            // ======================
            // GRAPHQL TEAM QUERIES
            // ======================
            async function getTeamMembers(teamSlug) {
              const org = 'oppia';
              try {
                const result = await github.graphql({
                  query: `
                    query ($org: String!, $teamSlug: String!) {
                      organization(login: $org) {
                        team(slug: $teamSlug) {
                          members(first: 100) {
                            nodes { login }
                          }
                        }
                      }
                    }
                  `,
                  org,
                  teamSlug,
                  headers: {
                    authorization: `token ${process.env.PAT_TOKEN}`
                  }
                });
                
                return new Set(
                  result.organization.team.members.nodes
                    .map(node => node.login.toLowerCase())
                );
              } catch (error) {
                core.error(`Team query failed: ${error.message}`);
                return new Set();
              }
            }


            const action = context.payload.action;
            const label = (context.payload.label?.name || '').trim();
            const sender = (context.payload.sender?.login || '').toLowerCase();
            const prNumber = context.issue.number;
            const { owner, repo } = context.repo;

            // Validate critical inputs
            if (!/^[\w\s-:]+$/i.test(label)) {
              core.error(`Invalid label format: ${label}`);
              return;
            }

            // Fetch team data
            const [releaseTeam, serverJobTeam] = await Promise.all([
              getTeamMembers('oppia-release-coordinators'),
              getTeamMembers('oppia-server-job-admins')
            ]);

            const authorizedUsers = new Set([...releaseTeam, ...serverJobTeam]);
            const validLabels = new Set(process.env.VALID_LABELS.split(',').map(l => l.trim()));

            // Label change handlers
            const handleDatastoreLabelRemoval = async () => {
              if (!authorizedUsers.has(sender)) {
                await octokit.issues.addLabels({
                  owner,
                  repo,
                  issue_number: prNumber,
                  labels: [label]
                });
                await octokit.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: `@${sender} Unauthorized label removal detected. Only authorized team members may remove "${label}".`
                });
              }
            };

            const handleHotfixLabelAddition = async () => {
              const coordinators = [...releaseTeam];
              if (coordinators.length > 0) {
                const assignee = coordinators[Math.floor(Math.random() * coordinators.length)];
                await octokit.issues.addAssignees({
                  owner,
                  repo,
                  issue_number: prNumber,
                  assignees: [assignee]
                });
                await octokit.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: `Hotfix label added. Randomly assigned to @${assignee} for priority review.`
                });
              }
            };

            // Execute label-specific logic
            switch(true) {
              case action === 'unlabeled' && label === 'PR: Affects datastore layer':
                await handleDatastoreLabelRemoval();
                break;

              case action === 'labeled' && label === 'PR: Needs to be hotfixed':
                await handleHotfixLabelAddition();
                break;

              case action === 'labeled' && !validLabels.has(label):
                await octokit.issues.removeLabel({ owner, repo, issue_number: prNumber, name: label });
                await octokit.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: `@${sender}, I've removed an invalid label: ${label}`
                });
                break;
            }
