name: Image Compression Check
permissions: read-all
on:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - develop
      - release-*
      - issue#21274
  pull_request:
    branches:
      - develop
      - release-*

jobs:
  run_compression_check:
    name: Run Image Compression Check
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          architecture: 'x64'

      - name: Run Image Compression Check
        if: startsWith(github.head_ref, 'update-changelog-for-release') == false
        id: compression
        run: make compress_images

      - name: Send failure notification
        if: ${{ failure() }}
        uses: ./.github/actions/send-webhook-notification
        with:
          message: "Image compression check failed on ${{ github.ref }} in ${{ github.repository }}"
      
      - name: Upload output files as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: script-output
          path: compressed_images/
          retention-days: 7
