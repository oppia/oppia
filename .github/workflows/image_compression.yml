name: Image Compression Check
on:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - develop
      - issue#21274
      - release-*
  pull_request:
    branches:
      - develop
      - release-*

jobs:
  prepare_and_run_compression_check:
    name: Prepare Environment
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.9.20
        uses: actions/setup-python@v4
        with:
          python-version: '3.9.20'
          architecture: 'x64'

      - name: Install GraphicsMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y graphicsmagick
      
      - name: Add GraphicsMagick to PATH
        run: echo "$(dirname $(which gm))" >> $GITHUB_PATH

      - name: Run Image Compression Check
        if: startsWith(github.head_ref, 'update-changelog-for-release') == false
        id: compression
        run: |
          make image_compression_check
          echo "changes_made=$(git status --porcelain | grep -c "M" || echo "0")" >> $GITHUB_ENV

  commit_and_push:
    name: Commit Compressed Images
    needs: prepare_and_run_compression_check
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    if: ${{ needs.prepare_and_run_compression_check.outputs.changes_made != '0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}  
          token: ${{ secrets.BOT_TOKEN }}  

      - name: Merge develop branch into the current branch
        uses: ./.github/actions/merge-develop-and-set-up-dependencies

      - name: Commit and push compressed images
        run: |
          git config --local user.email "bot@oppia.org"
          git config --local user.name "Oppia Bot"
          git add -A
          git commit -m "chore: Compress images via CI
          Automated image compression to optimize file sizes.
          This commit was automatically generated by the CI workflow."
          git fetch origin ${{ github.head_ref }}
          git rebase origin/${{ github.head_ref }}
          git push -u origin feat#21274
          
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        run: |
          PR_NUMBER=$(echo $GITHUB_REF | awk 'BEGIN { FS = "/" } ; { print $3 }')
          curl -X POST \
            -H "Authorization: token ${{ secrets.BOT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/comments \
            -d '{"body":"🤖 I have compressed some images in this PR to optimize file sizes. The changes have been automatically committed. Please review the changes and make sure everything looks correct."}'
        
  report_failure:
    name: Report Compression Failure
    needs: [prepare_and_run_compression_check]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    if: ${{ failure() && github.event_name == 'push' && github.repository == 'oppia/oppia' && github.ref == 'refs/heads/develop'}}

    steps:
      - name: Send Webhook Notification
        uses: ./.github/actions/send-webhook-notification
        with:
          message: "Image compression check failed on the upstream develop branch."
          webhook-url: ${{ secrets.BUILD_FAILURE_ROOM_WEBHOOK_URL }}
