name: Assign Reviewer For Contributor

on:
  pull_request_target:
    types: [opened]

permissions: read-all

jobs:
  manage_reviewers:
    name: Manage Reviewers and Notifications
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Handle Reviewers and Notifications
        uses: actions/github-script@v7
        with:
          script: |
            // ======================
            // INPUT SANITIZATION
            // ======================
            const validateGitHubUsername = (username) => {
              if (typeof username !== 'string') return false;
              return /^[a-z\d](?:[a-z\d]|-(?=[a-z\d])){0,38}$/i.test(username);
            };
            
            const sanitizeUsername = (input) => {
              return validateGitHubUsername(input) ? input : '';
            };
            
            const sanitizeRepo = (input) => {
              const allowed = /^[A-Za-z0-9_.-]{1,100}$/;
              if (typeof input !== 'string') return '';
              return allowed.test(input) ? input : '';
            };
            
            const sanitizePrNumber = (num) => {
              const n = Number(num);
              return Number.isInteger(n) && n > 0 ? n : NaN;
            };
            
            // Core PR metadata with validation
            if (!context.payload?.pull_request || !context.payload.repository) {
              core.setFailed('Invalid event payload');
              return;
            }
            
            const prNumber = sanitizePrNumber(context.payload.pull_request.number);
            if (isNaN(prNumber)) {
              core.setFailed(`Invalid PR number: ${context.payload.pull_request.number || 'undefined'}`);
              return;
            }
            
            const repo = sanitizeRepo(context.payload.repository.name);
            const owner = sanitizeUsername(context.payload.repository.owner.login);
            if (!repo || !owner) {
              core.setFailed(`Invalid repo (${repo}) or owner (${owner})`);
              return;
            }
            
            // Sanitize PR author
            const prAuthor = sanitizeUsername(context.payload.pull_request.user?.login);
            if (!prAuthor) {
              console.log('Unable to determine PR author');
            }

            // ======================
            // CONTRIBUTOR CHECK
            // ======================
            const isNewContributor = await (async () => {
              if (!prAuthor) return false;
              
              try {
                const searchResults = await github.rest.search.issuesAndPullRequests({
                  q: `repo:${owner}/${repo} type:pr is:merged author:${prAuthor}`
                });
                
                return searchResults.data.total_count === 0;
              } catch (error) {
                // Fail noisily for unexpected errors
                core.setFailed(`Contributor check failed: ${error.message}`);
                throw error;
              }
            })();

            // ======================
            // REVIEWER VALIDATION
            // ======================
            const requestedIndividualReviewers = 
              (context.payload.pull_request.requested_reviewers || [])
                .map(r => sanitizeUsername(r?.login))
                .filter(username => username);

            const requestedTeamReviewers = 
              (context.payload.pull_request.requested_teams || [])
                .map(t => t?.slug)
                .filter(slug => {
                  // Allow single-character team names
                  if (typeof slug !== 'string') return false;
                  return /^[a-z\d](?:[a-z\d]|-[a-z\d])*$/i.test(slug);
                });

            const hasIndividualReviewers = requestedIndividualReviewers.length > 0;
            const hasTeamReviewers = requestedTeamReviewers.length > 0;

            // ======================
            // REVIEWER ASSIGNMENT
            // ======================
            if (hasIndividualReviewers) {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: prNumber,
                assignees: requestedIndividualReviewers
              });

              const firstReviewer = requestedIndividualReviewers[0];
              const assignmentMessage = `Assigning @${firstReviewer} for the first pass review of this PR. Thanks!`;
              
              if (assignmentMessage.length <= 500) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: assignmentMessage
                });
              } 
            }

            // ======================
            // NOTIFICATION SYSTEM
            // ======================
            if (!hasIndividualReviewers) {
              // Notify if no individual reviewers exist (even if team reviewers exist)
              // This helps catch cases where team has no active reviewers
              
              // Try to assign a random member from dev-workflow-reviewers team
              try {
                const teamMembers = await github.rest.teams.listMembersInOrg({
                  org: owner,
                  team_slug: 'dev-workflow-reviewers'
                });
                
                if (teamMembers.data && teamMembers.data.length > 0) {
                  // Pick a random reviewer from the team
                  const randomIndex = Math.floor(Math.random() * teamMembers.data.length);
                  const randomReviewer = teamMembers.data[randomIndex].login;
                  
                  if (validateGitHubUsername(randomReviewer)) {
                    // Add as reviewer and assignee
                    await github.rest.pulls.requestReviewers({
                      owner,
                      repo,
                      pull_number: prNumber,
                      reviewers: [randomReviewer]
                    });
                    
                    await github.rest.issues.addAssignees({
                      owner,
                      repo,
                      issue_number: prNumber,
                      assignees: [randomReviewer]
                    });
                    
                    const assignmentMessage = `No individual reviewers found. Assigned @${randomReviewer} from the dev-workflow-reviewers team. Thanks!`;
                    
                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: prNumber,
                      body: assignmentMessage
                    });
                    
                    return; // Skip the general notification since we've assigned someone
                  }
                }
              } catch (error) {
                console.error('Error assigning random reviewer:', error.message);
                // Continue to general notification if random assignment fails
              }
              
              // Fall back to general notification if random assignment failed or wasn't possible
              const notificationMessage = `No individual reviewers${hasTeamReviewers ? ' (only team reviewers)' : ' or teams'} were found by GitHub. @oppia/dev-workflow-reviewers, could you please review the issue and assign an appropriate reviewer? Thank you!`;

              if (notificationMessage.length <= 500) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: notificationMessage
                });
              } else {
                console.log('Notification message too long, skipping comment');
              }
            }

            // ======================
            // NEW CONTRIBUTOR GUIDANCE
            // ======================
            if (isNewContributor && prAuthor) {
              const guidanceMessage = `Hello @${prAuthor}! Thank you for making a PR.
              Please ensure your PR is assigned to the correct reviewers -- check the "Assignees" section in the sidebar on the right. Typically, this should match the "Reviewers" section.
              If it's not correct, you can leave a comment with the syntax \`@reviewer_username PTAL\` to request that a specific reviewer be assigned.`;

              if (guidanceMessage.length <= 500) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: guidanceMessage
                });
              } else {
                console.log('Guidance message too long, skipping comment');
              }
            }

  report-failure:
    needs: manage_reviewers
    runs-on: ubuntu-24.04
    if: ${{ always() && needs.manage_reviewers.result == 'failure' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Send notification
        uses: ./.github/actions/send-webhook-notification
        with:
          message: "Failed to Handle Reviewers and Notifications"
          webhook-url: ${{ secrets.BUILD_FAILURE_ROOM_WEBHOOK_URL }}
