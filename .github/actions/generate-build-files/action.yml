name: Generate build files
description: 'Generate build files'
inputs:
  working-directory:
    description: 'Repository directory relative to the GitHub workspace.'
    required: false
    default: '.'
  prod-env:
    description: "Whether to build in prod mode."
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Restore build files from cache
      id: restore_build_files_cache
      uses: actions/cache@v4
      with:
        key: ${{ runner.os }}-build-files-${{ inputs.prod-env != 'false' && 'prod' || 'dev' }}-${{ github.sha }}
        path: |
          ${{ github.workspace }}/${{ inputs.working-directory }}/build
          ${{ github.workspace }}/${{ inputs.working-directory }}/app.yaml
          ${{ github.workspace }}/${{ inputs.working-directory }}/assets/hashes.json
          ${{ github.workspace }}/${{ inputs.working-directory }}/dist
          ${{ github.workspace }}/${{ inputs.working-directory }}/third_party/generated
    - name: Build (prod)
      if: steps.restore_build_files_cache.outputs.cache-hit != 'true' && inputs.prod-env != 'false'
      run: python -m scripts.build --prod_env
      working-directory: ${{ inputs.working-directory }}
      shell: bash
    - name: Build (dev)
      if: steps.restore_build_files_cache.outputs.cache-hit != 'true' && inputs.prod-env == 'false'
      run: python -c "from scripts import build; build.build_js_files(dev_mode=True)"
      working-directory: ${{ inputs.working-directory }}
      shell: bash
