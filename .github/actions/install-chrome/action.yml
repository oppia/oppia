name: 'Install Chrome'
description: 'Installs Chrome for use in tests'

runs:
  using: 'composite'
  steps:
    - id: install-chrome
      name: Install Chrome
      # Installs a pinned version of Chrome for Testing from:
      # https://github.com/GoogleChromeLabs/chrome-for-testing
      uses: browser-actions/setup-chrome@v2
      with:
        chrome-version: '145.0.7632.116'
        install-dependencies: true
