port              6379
# Oppia's startup scripts (like scripts/servers.py) manage the Redis process
# directly, so daemonization must be disabled to prevent the parent process
# from exiting immediately after forking.
daemonize         no
# Disabling RDB snapshots prevents IO overhead and disk space issues in
# resource-constrained CI environments.
# save              60 1
save              ""
bind              127.0.0.1
tcp-keepalive     300
dbfilename        dump.rdb
dir               ./
rdbcompression    yes
